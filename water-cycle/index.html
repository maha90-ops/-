<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة قطرة الماء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <img src="assets/drop.png" alt="" width="34" height="37">
      <span>رحلة قطرة الماء</span>
    </div>

    <div class="progress" aria-label="تقدّم الرحلة">
      <span class="progress__text" id="progressText">المهمة ١ من ٤</span>
      <ol class="progress__track" id="progressTrack"></ol>
    </div>

    <div class="tools">
      <button class="tool" id="btnAutoRead" type="button" aria-pressed="false" title="قراءة كلام كنعان تلقائيًا">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span class="tool__label">قراءة تلقائية</span>
      </button>
      <button class="tool" id="btnSfx" type="button" aria-pressed="true" title="أصوات التفاعل">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
        <span class="tool__label">المؤثرات</span>
      </button>
    </div>
  </div>
  <div class="tatreez" aria-hidden="true"></div>
</header>

<main class="mission" id="mission">

  <div class="mission__head">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="missionTitle"></h1>
    <p class="objective" id="objective"></p>
  </div>

  <!-- المشهد: العنصر التفاعلي الرئيسي للاستكشاف -->
  <section class="stage" aria-labelledby="stageLabel">
    <h2 class="sr-only" id="stageLabel">مشهد التبخّر: اضغط على العناصر لتستكشفها</h2>
    <div class="scene" id="scene">
      <svg class="scene__art" id="sceneArt" viewBox="0 0 800 450" role="img" aria-label="بركة ماء تشرق عليها الشمس ويرتفع منها البخار، وقطرة الماء تقف على الشاطئ">
        <defs>
          <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#CFE8F7"/><stop offset=".75" stop-color="#EEF7FC"/>
          </linearGradient>
          <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6CBDEB"/><stop offset="1" stop-color="#2B7FC1"/>
          </linearGradient>
          <radialGradient id="gSun" cx=".4" cy=".4" r=".7">
            <stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#F6B53A"/>
          </radialGradient>
          <radialGradient id="gGlow">
            <stop offset="0" stop-color="#FFD66B" stop-opacity=".55"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <rect width="800" height="450" fill="url(#gSky)"/>

        <!-- تلال بعيدة وزيتونة وجدار حجري (هوية هادئة) -->
        <path d="M0 270 C120 225 240 240 360 262 C470 282 560 230 660 214 C730 204 770 214 800 222 V320 H0Z" fill="#DCE8D1"/>
        <path d="M430 300 C520 262 610 246 700 250 C750 252 780 260 800 266 V330 H430Z" fill="#C6D8B3"/>
        <g class="terrace" fill="#E6D9BD" stroke="#CDBD9C" stroke-width="1.5">
          <rect x="604" y="262" width="26" height="14" rx="3"/><rect x="632" y="262" width="30" height="14" rx="3"/>
          <rect x="664" y="262" width="24" height="14" rx="3"/><rect x="690" y="262" width="28" height="14" rx="3"/>
          <rect x="618" y="248" width="28" height="14" rx="3"/><rect x="648" y="248" width="26" height="14" rx="3"/><rect x="676" y="248" width="30" height="14" rx="3"/>
        </g>
        <g class="olive">
          <path d="M742 252 C740 236 744 222 739 206" stroke="#6E5A43" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M741 222 C752 214 760 212 768 206" stroke="#6E5A43" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="728" cy="198" rx="24" ry="15" fill="#8A9C58"/>
          <ellipse cx="756" cy="190" rx="22" ry="14" fill="#7A8D4B"/>
          <ellipse cx="742" cy="180" rx="20" ry="13" fill="#95A764"/>
          <ellipse cx="770" cy="206" rx="15" ry="10" fill="#8A9C58"/>
        </g>

        <!-- الشمس -->
        <g class="sun" id="artSun">
          <circle class="sun__glow" cx="150" cy="95" r="95" fill="url(#gGlow)"/>
          <g class="sun__rays" stroke="#F6B53A" stroke-width="7" stroke-linecap="round">
            <line x1="150" y1="25" x2="150" y2="10"/><line x1="150" y1="165" x2="150" y2="180"/>
            <line x1="80" y1="95" x2="65" y2="95"/><line x1="220" y1="95" x2="235" y2="95"/>
            <line x1="100" y1="45" x2="90" y2="35"/><line x1="200" y1="145" x2="210" y2="155"/>
            <line x1="200" y1="45" x2="210" y2="35"/><line x1="100" y1="145" x2="90" y2="155"/>
          </g>
          <circle cx="150" cy="95" r="50" fill="url(#gSun)"/>
          <circle class="sun__ring" cx="150" cy="95" r="66" fill="none" stroke="#F2A21E" stroke-width="4" stroke-dasharray="6 10"/>
        </g>

        <!-- أشعة دافئة نحو الماء (تظهر عند تسخين الماء) -->
        <g class="beams" stroke="#F6B53A" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16" fill="none">
          <path d="M190 150 L270 290"/><path d="M170 160 L200 290"/><path d="M210 135 L350 290"/>
        </g>

        <!-- الماء -->
        <g class="water" id="artWater">
          <path d="M0 304 C60 296 120 312 180 304 C240 296 300 312 360 304 C420 296 480 312 540 304 C600 296 660 312 720 304 C760 299 790 304 800 304 V450 H0Z" fill="url(#gWater)"/>
          <g class="water__shine" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4" stroke-linecap="round">
            <line x1="70" y1="340" x2="120" y2="340"/><line x1="250" y1="360" x2="310" y2="360"/>
            <line x1="150" y1="398" x2="190" y2="398"/><line x1="400" y1="380" x2="450" y2="380"/>
          </g>
          <ellipse class="ripple" cx="300" cy="352" rx="30" ry="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        </g>

        <!-- الشاطئ الحجري -->
        <path d="M560 450 C580 372 640 330 800 324 V450Z" fill="#E9DDC1"/>
        <path d="M560 450 C580 372 640 330 800 324" fill="none" stroke="#D6C6A2" stroke-width="3"/>

        <!-- بخار الماء -->
        <g class="vapor" id="artVapor" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
          <path class="wisp w1" d="M260 292 C246 270 274 252 260 230 C246 208 274 190 260 168"/>
          <path class="wisp w2" d="M350 292 C336 270 364 252 350 230 C336 208 364 190 350 168"/>
          <path class="wisp w3" d="M440 292 C426 270 454 252 440 230 C426 208 454 190 440 168"/>
        </g>
        <g class="vapor vapor--edge" fill="none" stroke="#9CC6E4" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <path class="wisp w1" d="M260 292 C246 270 274 252 260 230 C246 208 274 190 260 168"/>
          <path class="wisp w2" d="M350 292 C336 270 364 252 350 230 C336 208 364 190 350 168"/>
          <path class="wisp w3" d="M440 292 C426 270 454 252 440 230 C426 208 454 190 440 168"/>
        </g>

        <!-- قطرة الماء (من الصور المرجعية) -->
        <g class="drop" id="artDrop">
          <ellipse cx="652" cy="372" rx="40" ry="7" fill="#000" opacity=".08"/>
          <image href="assets/drop.png" x="600" y="254" width="106" height="116"/>
        </g>
      </svg>

      <!-- نقاط الاستكشاف: أزرار حقيقية فوق المشهد -->
      <div class="hotspots" id="hotspots"></div>

      <!-- بطاقة معلومات صغيرة -->
      <div class="infocard" id="infocard" hidden>
        <div class="infocard__body">
          <p class="infocard__title" id="infoTitle"></p>
          <p class="infocard__text" id="infoText"></p>
        </div>
        <button class="infocard__close" id="infoClose" type="button" aria-label="إغلاق البطاقة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- كنعان: الوكيل التعليمي -->
  <aside class="guide" aria-label="كنعان، رفيقك في الرحلة">
    <div class="guide__avatar">
      <img id="kanaanFace" src="assets/kanaan-smile.png" alt="كنعان" width="140" height="140">
    </div>
    <div class="guide__bubble">
      <p class="guide__name">كنعان</p>
      <p class="guide__text" id="kanaanText" aria-live="polite"></p>
      <div class="guide__actions">
        <button class="ghost" id="btnListen" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>
          استمع
        </button>
        <button class="ghost" id="btnHelp" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
          أحتاج مساعدة
        </button>
      </div>
      <p class="guide__level" id="supportLevel" hidden></p>
    </div>
  </aside>

  <!-- السؤال الاستقصائي -->
  <section class="ask" aria-labelledby="questionText">
    <p class="ask__step">سؤال الاستكشاف</p>
    <h2 class="ask__question" id="questionText"></h2>
    <div class="choices" id="choices" role="group" aria-labelledby="questionText"></div>

    <div class="earned" id="earned" hidden>
      <div class="earned__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect x="4" y="26" width="18" height="12" rx="3"/><rect x="24" y="26" width="20" height="12" rx="3"/><rect x="12" y="12" width="22" height="12" rx="3"/></svg>
      </div>
      <div class="earned__text">
        <p class="earned__badge" id="earnedBadge"></p>
        <p class="earned__resource" id="earnedResource"></p>
      </div>
      <button class="primary" id="btnBuild" type="button"></button>
    </div>
  </section>
</main>

<!-- مشهد البناء -->
<dialog class="build" id="buildDialog" aria-labelledby="buildTitle">
  <div class="build__inner">
    <img class="build__kanaan" src="assets/kanaan-celebrate.png" alt="" width="144" height="158">
    <h2 id="buildTitle"></h2>
    <svg class="build__art" id="buildArt" viewBox="0 0 360 200" role="img" aria-label="أرض البيت: خيمة، وبجانبها أساس حجري يُبنى">
      <rect width="360" height="200" fill="#F0F7FB" rx="16"/>
      <path d="M0 160 H360 V200 H0Z" fill="#DCE8D1"/>
      <!-- خيمة -->
      <g class="tent">
        <path d="M30 160 L80 92 L130 160Z" fill="#E7DEC9" stroke="#BFAF8C" stroke-width="2"/>
        <path d="M80 92 L80 160" stroke="#BFAF8C" stroke-width="2"/>
        <path d="M70 160 L80 128 L90 160Z" fill="#8A7A5E"/>
      </g>
      <!-- البيت المنتظر (مخطط) -->
      <g class="ghost-house" fill="none" stroke="#9BB0C2" stroke-width="2" stroke-dasharray="6 6">
        <rect x="180" y="86" width="150" height="58"/>
        <path d="M172 86 L255 40 L338 86"/>
        <rect x="243" y="108" width="24" height="36"/>
      </g>
      <!-- حجارة الأساس -->
      <g class="stones" id="stones" fill="#E3D3B1" stroke="#B9A47C" stroke-width="2"></g>
    </svg>
    <ul class="parts" id="parts"></ul>
    <p class="build__story" id="buildStory"></p>
    <div class="build__actions">
      <button class="primary" id="btnNext" type="button"></button>
      <button class="ghost" id="btnReplay" type="button">أعد المهمة</button>
    </div>
    <p class="build__note" id="nextNote"></p>
  </div>
</dialog>

<script src="content/missions.js"></script>
<script src="app.js"></script>
</body>
</html>
