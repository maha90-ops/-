    sim.set(20);

    function track(v) {
      if (v <= R.low) { seenLow = true; $('[data-c=low]').classList.add('ok'); }
      if (v >= R.high) { seenHigh = true; $('[data-c=high]').classList.add('ok'); }
      flow.refresh();
    }

    var tick = setInterval(function () {
      var r = sim.read();
      mMotion.set(r.motion, r.motionWord); mVapor.set(r.vapor, r.vaporWord);
      $('[data-live]').textContent = 'حرارة الشمس: ' + ar.pct(sl.value);
    }, 250);

    // compare tool (shown from the start for supported learners, or as the extra activity after a first error)
    var cmp = $('[data-compare]');
    if (plan.toolFromStart) cmp.hidden = false;
    cmp.querySelectorAll('[data-m]').forEach(function (b) {
      b.onclick = function () {
        if (busy) return;
        busy = true; var which = b.dataset.m, val = which === 'low' ? 20 : 90;
        sl.set(val, true); b.textContent = 'جارٍ القياس…';
        sim.measure(4).then(function (n) {
          busy = false; measured[which] = n;
          b.textContent = which === 'low' ? 'قِس عند ٢٠٪ ✓' : 'قِس عند ٩٠٪ ✓';
          var max = Math.max(measured.low || 0, measured.high || 0, 1);
          ['low', 'high'].forEach(function (k) {
            if (measured[k] === null) return;
            cmp.querySelector('[data-b=' + k + ']').style.width = (measured[k] / max * 100) + '%';
            cmp.querySelector('[data-v=' + k + ']').textContent = ar.digits(measured[k]);
          });
          if (measured.low !== null && measured.high !== null) {
            N.say({ kind: 'question', text: 'عند ٢٠٪ صعدت ' + ar.digits(measured.low) + ' نفثات بخار، وعند ٩٠٪ صعدت ' + ar.digits(measured.high) + '. ماذا تخبرك هذه المقارنة؟', timeout: 9000 });
            if (compareNeeded) { compareNeeded = false; flow.release(); }
          }
        });
      };
    });

    var flow = new WC.LabFlow({
      app: app, concept: 'evaporation', host: $('[data-flow]'),
      gateText: 'جرّب حرارة منخفضة ثم مرتفعة، ليظهر سؤال الاستنتاج.',
      isReady: function () { return seenLow && seenHigh; },
      nearTitle: 'اقتربت…',
      whyText: 'لاحظتُ أن العلاقة بين الحرارة والبخار تحتاج إلى ملاحظة أدق، لذلك أضفتُ لك <b>تجربة مقارنة</b>. جرّب مقارنة الحرارة المنخفضة بالحرارة المرتفعة، ثم أجب من جديد.',
      onExtra: function () {
        cmp.hidden = false; compareNeeded = true;
        measured = { low: null, high: null };
        cmp.querySelectorAll('.bar i').forEach(function (i) { i.style.width = 0; });
        cmp.querySelectorAll('[data-v]').forEach(function (i) { i.textContent = '—'; });
        cmp.querySelector('[data-m=low]').textContent = 'قِس عند ٢٠٪'; cmp.querySelector('[data-m=high]').textContent = 'قِس عند ٩٠٪';
        cmp.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cmp.querySelector('[data-m=low]').focus({ preventScroll: true });
      },
      scaffoldText: 'دعنا نجرّب بطريقة أخرى: ضع الحرارة على ٢٠٪ وراقب البخار، ثم ارفعها إلى ٩٠٪. من أين صعد بخار أكثر؟ ولماذا تسارعت الجزيئات؟',
      onGuided: function (done) {
        WC.guidedDemo([
          { apply: function () { sl.set(15, true); }, say: 'انظر: الحرارة الآن ١٥٪. الجزيئات بطيئة، والبخار المتصاعد قليل جدًا.' },
          { apply: function () { sl.set(55, true); }, say: 'رفعتُ الحرارة إلى ٥٥٪… لاحظ أن الجزيئات أسرع، وبدأ البخار يزداد.' },
          { apply: function () { sl.set(95, true); }, say: 'والآن ٩٥٪: الجزيئات سريعة جدًا، والبخار يتصاعد بكثرة.' }
        ], done);
      },
      next: 'cloud', nextLabel: 'تابع إلى مختبر السحب'
    });

    if (plan.intro) {
      setTimeout(function () {
        N.say({ kind: 'question', text: plan.misconceptionNote
          ? 'توقّعتَ أن الماء يصير مطرًا مباشرة. لنختبر ذلك: حرّك حرارة الشمس، وتتبّع ما يصعد من سطح الماء.'
          : 'هل يبقى الماء كما هو فعلًا؟ حرّك حرارة الشمس من منخفضة إلى مرتفعة، وقارن ما تراه.' });
      }, 700);
    }
    return function () { clearInterval(tick); sim.stop(); };
  }
};

</script>
<script>
/* cloud.js — Screen 4: clouds & condensation lab. */
window.WC = window.WC || {}; WC.Screens = WC.Screens || {};

WC.Screens.cloud = {
  rail: 4,
  mount: function (main, app) {
    var UI = WC.UI, ar = WC.ar, N = WC.Nuqta, L = app.learner;
    var plan = WC.Engine.plan(L, 'condensation');
    var R = WC.RULES.explore.condensation;
    var cooled = false, sawCloud = false, slowNeeded = false, log = {};
    var STEPS = [{ v: 0, t: 'دافئ جدًا' }, { v: 30, t: 'دافئ' }, { v: 65, t: 'بارد' }, { v: 95, t: 'بارد جدًا' }];
    var STAGE = { vapor: 'بخار فقط', drops: 'قطرات صغيرة', cloud: 'سحابة' };
    function word(v) { return v < 20 ? 'دافئ جدًا' : v < 45 ? 'دافئ' : v < 65 ? 'معتدل' : v < 85 ? 'بارد' : 'بارد جدًا'; }

    main.innerHTML =
      '<section class="lab screen">' +
      '<div class="panel">' +
      '<header><span class="eyebrow">المختبر الثاني · الهواء والبخار</span><h2>مختبر السحب</h2>' +
      '<p class="task">برّد <b>الهواء</b> تدريجيًا، وراقب ما يحدث لبخار الماء الصاعد.</p></header>' +
      '<div data-notes></div>' +
      '<div data-slider></div>' +
      '<div class="chain3" aria-live="polite" aria-label="مرحلة البخار الآن">' +
      '<div class="node" data-s="vapor"><b aria-hidden="true">💨</b>بخار ماء</div><span class="sep" aria-hidden="true">←</span>' +
      '<div class="node" data-s="drops"><b aria-hidden="true">💧</b>قطرات صغيرة</div><span class="sep" aria-hidden="true">←</span>' +
      '<div class="node" data-s="cloud"><b aria-hidden="true">☁️</b>سحابة</div></div>' +
      '<ul class="checks" aria-label="خطوات الملاحظة"><li data-c="cool">برّد الهواء حتى يصبح باردًا</li><li data-c="see">لاحظ ما تكوّن في الأعلى</li></ul>' +
      '<div class="step-block" data-slow hidden>' +
      '<b>🌡️ تجربة التبريد البطيء</b><span class="muted">اختر الدرجات بالترتيب من الأدفأ إلى الأبرد، وانتظر قليلًا عند كل درجة.</span>' +
      '<div class="steps4" role="group" aria-label="درجات حرارة الهواء"></div>' +
      '<table class="coollog"><thead><tr><th>الهواء</th><th>ماذا تكوّن؟</th></tr></thead><tbody></tbody></table></div>' +
      '<div data-flow></div>' +
      '</div>' +
      '<figure class="card stage" style="margin:0"><canvas role="img" aria-label="محاكاة: بخار يصعد من بحيرة نحو هواء يبرد، فيتحول إلى قطرات تتجمع في سحابة"></canvas>' +
      '<figcaption class="caption"><span class="legend"><span>◌ بخار</span><span>💧 قطرة صغيرة</span><span>☁️ سحابة</span></span><span data-live aria-live="polite"></span></figcaption></figure>' +
      '</section>';

    var $ = function (s) { return main.querySelector(s); };
    var sim = new WC.CloudSim($('canvas')).start();
    var notes = $('[data-notes]');
    // adaptation visible to the learner: recap only if evaporation needed support
    if (plan.recap.indexOf('evaporation') > -1)
      notes.appendChild(UI.pathNote('تذكير سريع لأنك احتجت إلى تجربة إضافية في التبخر: حرارة الشمس تحوّل الماء إلى <b>بخار يصعد</b> إلى الأعلى.', '↩️'));
    else
      notes.appendChild(UI.pathNote('أتقنتَ <b>التبخر</b>، فلن نعيد شرحه. ننتقل مباشرة إلى ما يحدث للبخار في الأعلى.', '⏭️'));

    var sl = UI.slider({ id: 'air', label: '🌡️ درجة حرارة الهواء', value: 10, ends: ['دافئ', 'بارد'], cls: 'cold-track',
      format: function (v) { return ar.deg(30 - v * 0.32) + ' · ' + word(v); },
      onInput: function (v) { sim.set(v); if (v >= R.cold) { cooled = true; $('[data-c=cool]').classList.add('ok'); } flow.refresh(); } });
    $('[data-slider]').appendChild(sl.node);
    sim.set(10);

    var tick = setInterval(function () {
      var st = sim.stage();
      main.querySelectorAll('.chain3 .node').forEach(function (n) { n.classList.toggle('on', n.dataset.s === st); });
      if (st === 'cloud' && !sawCloud) { sawCloud = true; $('[data-c=see]').classList.add('ok'); flow.refresh(); }
      $('[data-live]').textContent = 'الهواء: ' + word(sl.value) + ' · الآن: ' + STAGE[st];
    }, 300);

    // extra activity: slow, stepwise cooling with an observation log
    var slow = $('[data-slow]'), steps = slow.querySelector('.steps4'), tbody = slow.querySelector('tbody'), wait;
    STEPS.forEach(function (s, i) {
      var b = UI.h('<button type="button" aria-pressed="false">' + s.t + '</button>');
      b.onclick = function () {
        steps.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        sl.set(s.v, true);
        clearTimeout(wait);
        renderLog(i, '… راقب');
        wait = setTimeout(function () {
          log[i] = STAGE[sim.stage()]; renderLog(i);
          if (Object.keys(log).length === STEPS.length && slowNeeded) {
            slowNeeded = false; sl.disable(false);
            N.say({ kind: 'question', text: 'انظر إلى جدول ملاحظاتك: كلما برد الهواء أكثر… ماذا حدث للبخار؟', timeout: 8000 });
            flow.release();
          }
        }, 4200);
      };
      steps.appendChild(b);
    });
    function renderLog(cur, pending) {
      tbody.innerHTML = STEPS.map(function (s, i) {
        var val = log[i] || (i === cur && pending ? pending : '—');
        return '<tr class="' + (i === cur ? 'cur' : '') + '"><td>' + s.t + '</td><td>' + val + '</td></tr>';
      }).join('');
    }
    renderLog(-1);

    var flow = new WC.LabFlow({
      app: app, concept: 'condensation', host: $('[data-flow]'),
      gateText: 'برّد الهواء ولاحظ ما يتكوّن في الأعلى، ليظهر سؤال الاستنتاج.',
      isReady: function () { return cooled && sawCloud; },
      whyText: 'لاحظتُ أن العلاقة بين برودة الهواء والبخار تحتاج إلى تجربة أبطأ، لذلك أضفتُ لك <b>تجربة التبريد البطيء</b>. سجّل ما يتكوّن عند كل درجة، ثم أجب من جديد.',
      onExtra: function () {
        slow.hidden = false; slowNeeded = true; log = {}; renderLog(-1);
        sl.disable(true); sl.set(0, true);
        slow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        steps.querySelector('button').focus({ preventScroll: true });
      },
      scaffoldText: 'دعنا نجرّب بطريقة أخرى. برّد الهواء ببطء ولاحظ ما يحدث للبخار. انظر إليه عندما يصل إلى الطبقة الباردة في الأعلى: هل يبقى بخارًا؟',
      onScaffold: function () { sl.set(0, true); },
      onGuided: function (done) {
        WC.guidedDemo([
          { apply: function () { sl.set(5, true); }, say: 'الهواء دافئ جدًا الآن: البخار يصعد ويبقى بخارًا.', wait: 4200 },
          { apply: function () { sl.set(65, true); }, say: 'برّدتُ الهواء… لاحظ أن بعض البخار يتحوّل إلى قطرات صغيرة في الأعلى.', wait: 4600 },
          { apply: function () { sl.set(95, true); }, say: 'الهواء بارد جدًا: القطرات الصغيرة تتجمّع وتكوّن سحابة.', wait: 4600 }
        ], done);
      },
      next: 'rain', nextLabel: 'تابع إلى مختبر المطر'
    });

    if (plan.misconceptionNote) {
      setTimeout(function () { N.say({ kind: 'why', text: 'في توقّعك الأول ظننتَ أن الماء يصير مطرًا مباشرة. هنا ستكتشف المرحلة التي تحدث <b>بين</b> البخار والمطر.' }); }, 700);
    } else if (plan.intro) {
      setTimeout(function () { N.say({ kind: 'question', text: 'ماذا يحدث لبخار الماء عندما يواجه هواءً أبرد؟ جرّب أن تغيّر درجة الحرارة.' }); }, 700);
    }
    return function () { clearInterval(tick); clearTimeout(wait); sim.stop(); };
  }
};

</script>
<script>
/* rain.js — Screen 5: rain & precipitation lab. */
window.WC = window.WC || {}; WC.Screens = WC.Screens || {};

WC.Screens.rain = {
  rail: 5,
  mount: function (main, app) {
    var UI = WC.UI, ar = WC.ar, N = WC.Nuqta, L = app.learner, RR = WC.RAIN_RULE;
    var plan = WC.Engine.plan(L, 'precipitation');
    var moved = { vapor: false, size: false }, sawRain = false;
    var probe = null; // extra activity: must observe small drops (no rain) then big drops (rain)
    function amount(v, w) { return ar.pct(v) + ' · ' + UI.level3(v / 100, w); }

    main.innerHTML =
      '<section class="lab screen">' +
      '<div class="panel">' +
      '<header><span class="eyebrow">المختبر الثالث · داخل السحابة</span><h2>مختبر المطر</h2>' +
      '<p class="task">غيّر <b>كمية البخار</b> و<b>حجم القطرات</b>، وابحث عن الظروف التي يهطل فيها المطر.</p></header>' +
      '<div data-notes></div>' +
      '<div data-sliders style="display:grid;gap:12px"></div>' +
      '<div class="path-note" data-obs aria-live="polite"><span class="ico" aria-hidden="true">☁️</span><span></span></div>' +
      '<div class="balance" data-balance hidden>' +
      '<b>⚖️ ثقل القطرة ودفع الهواء</b>' +
      '<span class="muted" style="font-size:.88rem">الهواء يدفع القطرات إلى الأعلى. الخط الأسود هو قوة هذا الدفع.</span>' +
      '<span style="font-size:.85rem">ثقل القطرة</span><div class="scale" data-w><i></i><span class="line" style="inset-inline-start:' + RR.size + '%"></span></div>' +
      '<span style="font-size:.85rem">الماء في السحابة</span><div class="scale" data-v><i></i><span class="line" style="inset-inline-start:' + RR.vapor + '%"></span></div>' +
      '<div class="lbls"><span>خفيف</span><span>ثقيل</span></div></div>' +
      '<ul class="checks" aria-label="خطوات الملاحظة"><li data-c="try">جرّب المتغيّرين</li><li data-c="rain">اجعل المطر يهطل</li></ul>' +
      '<div data-flow></div>' +
      '</div>' +
      '<figure class="card stage" style="margin:0"><canvas role="img" aria-label="محاكاة: سحابة بداخلها قطرات ماء، يهطل منها المطر عندما تكبر القطرات"></canvas>' +
      '<figcaption class="caption"><span class="legend"><span>💧 قطرات داخل السحابة</span><span>🌧️ مطر</span></span><span data-live aria-live="polite"></span></figcaption></figure>' +
      '</section>';

    var $ = function (s) { return main.querySelector(s); };
    var sim = new WC.RainSim($('canvas')).start();
    var notes = $('[data-notes]'), bal = $('[data-balance]');
    if (plan.recap.indexOf('condensation') > -1)
      notes.appendChild(UI.pathNote('تذكير لأنك احتجت إلى دعم في التكاثف: البخار يبرد فيتحوّل إلى <b>قطرات صغيرة</b> تكوّن السحابة.', '↩️'));
    if (plan.toolFromStart) {
      bal.hidden = false;
      notes.appendChild(UI.pathNote('أضفنا لك <b>مقياس الثقل</b> ليُظهر ما يحدث داخل السحابة، لأن رحلتك احتاجت إلى دعم في مرحلة سابقة.'));
    }

    var sv = UI.slider({ id: 'vapor', label: '💨 كمية بخار الماء', value: 25, ends: ['قليلة', 'كثيرة'],
      format: function (v) { return amount(v, ['قليلة', 'متوسطة', 'كثيرة']); },
      onInput: function (v) { sim.set('vapor', v); moved.vapor = true; check(); } });
    var ss = UI.slider({ id: 'size', label: '💧 حجم قطرات الماء', value: 20, ends: ['صغيرة', 'كبيرة'],
      format: function (v) { return amount(v, ['صغيرة', 'متوسطة', 'كبيرة']); },
      onInput: function (v) { sim.set('size', v); moved.size = true; check(); } });
    $('[data-sliders]').append(sv.node, ss.node);

    function check() {
      var st = sim.state();
      if (moved.vapor && moved.size) $('[data-c=try]').classList.add('ok');
      if (st.raining && !sawRain) { sawRain = true; $('[data-c=rain]').classList.add('ok'); }
      if (probe) {
        if (!st.raining && st.size < RR.size && st.vapor >= RR.vapor) probe.small = true;
        if (st.raining && probe.small) { probe = null; flow.release(); }
      }
      flow.refresh();
    }

    function observe() {
      var st = sim.state(), t;
      if (st.raining) t = 'بدأ الهطول! ' + st.word + '.';
      else if (st.size < RR.size && st.vapor < RR.vapor) t = 'السحابة خفيفة وقطراتها صغيرة… لا مطر.';
      else if (st.size < RR.size) t = 'السحابة ممتلئة بالقطرات، لكنها صغيرة وتبقى معلّقة في الهواء.';
      else t = 'القطرات كبيرة، لكن الماء في السحابة قليل.';
      $('[data-obs] .ico').textContent = st.raining ? '🌧️' : '☁️';
      $('[data-obs] span:last-child').textContent = t;
      $('[data-live]').textContent = st.word;
      bal.querySelector('[data-w] i').style.width = st.size + '%';
      bal.querySelector('[data-v] i').style.width = st.vapor + '%';
    }
    var tick = setInterval(observe, 250); observe();

    var flow = new WC.LabFlow({
      app: app, concept: 'precipitation', host: $('[data-flow]'),
      gateText: 'جرّب المتغيّرين حتى يهطل المطر، ليظهر سؤال الاستنتاج.',
      isReady: function () { return moved.vapor && moved.size && sawRain; },
      whyText: 'لاحظتُ أن سبب سقوط القطرات يحتاج إلى نظرة من داخل السحابة، لذلك أضفتُ <b>مقياس ثقل القطرة ودفع الهواء</b>. اجعل البخار كثيرًا مع قطرات صغيرة، ثم كبّر القطرات.',
      onExtra: function () {
        bal.hidden = false; probe = { small: false };
        sv.set(80, true); ss.set(25, true);
        bal.scrollIntoView({ behavior: 'smooth', block: 'center' });
        ss.input.focus({ preventScroll: true });
      },
      scaffoldText: 'دعنا نجرّب بطريقة أخرى: اجعل البخار كثيرًا، ثم كبّر القطرات شيئًا فشيئًا. متى بدأت القطرات تسقط؟ وهل يستطيع الهواء حمل القطرات الثقيلة؟',
      onScaffold: function () { bal.hidden = false; ss.set(20, true); },
      onGuided: function (done) {
        bal.hidden = false;
        WC.guidedDemo([
          { apply: function () { sv.set(85, true); ss.set(25, true); }, say: 'البخار كثير، لكن القطرات صغيرة وخفيفة: الهواء يحملها فتبقى معلّقة.' },
          { apply: function () { ss.set(55, true); }, say: 'كبّرتُ القطرات قليلًا… ما زال الهواء قادرًا على حملها.' },
          { apply: function () { ss.set(85, true); }, say: 'الآن كبرت القطرات وثقلت أكثر من دفع الهواء… فسقطت مطرًا.' }
        ], done);
      },
      interactiveChallenge: function (box, done) {
        var cfb = UI.h('<div class="feedback show"><b>تحدٍّ أعلى: اجعل المطر غزيرًا</b><span>ما أقل تغيير يجعل المطر غزيرًا؟ جرّب، وراقب الوصف تحت المؤشرين.</span></div>');
        var skip = UI.h('<button class="btn small ghost" type="button">تخطَّ التحدي الآن</button>');
        box.append(cfb, skip);
        var t = setInterval(function () {
          if (sim.state().intensity >= RR.heavy) {
            clearInterval(t); skip.remove();
            UI.feedback(cfb, 'good', 'اجتزت التحدي!', 'مطر غزير: بخار كثير جدًا وقطرات كبيرة جدًا.');
            done(true);
          }
        }, 300);
        skip.onclick = function () { clearInterval(t); skip.remove(); UI.feedback(cfb, 'near', 'لا بأس', 'سنعود إلى هذا التحدي لاحقًا في المهمة النهائية.'); done(false); };
        cleanup.push(function () { clearInterval(t); });
      },
      next: 'mission', nextLabel: 'تابع إلى مهمة الإنقاذ'
    });

    var cleanup = [];
    return function () { clearInterval(tick); cleanup.forEach(function (f) { f(); }); sim.stop(); };
  }
};

</script>
<script>
/* mission.js — Screen 6: rescue the water cycle.
   Faults are chosen by the engine from the learner model; hints are targeted
   by diagnosing which link of the chain is blocked right now. */
window.WC = window.WC || {}; WC.Screens = WC.Screens || {};

WC.Screens.mission = {
  rail: 6,
  mount: function (main, app) {
    var UI = WC.UI, ar = WC.ar, N = WC.Nuqta, E = WC.Engine, L = app.learner, M = WC.CYCLE_MODEL, RM = WC.RULES.mission, K = WC.CONTENT;
    var plan = E.planMission(L);
    var ctrl = Object.assign({}, M.good);
    plan.faults.forEach(function (f) {
      if (f === 'evaporation') ctrl.sun = M.fault.sun;
      if (f === 'condensation') ctrl.air = M.fault.air;
      if (f === 'precipitation') ctrl.size = M.fault.size;
    });
    var start = Object.assign({}, ctrl);
    var sinceHint = 0, tier = 0, lastHintAt = performance.now(), hold = 0, done = false;
    var hintEvery = plan.hard ? RM.hintEveryChanges.hard : RM.hintEveryChanges.normal;

    var NODES = [
      { k: 'heat', e: '☀️', l: 'حرارة الشمس' }, { k: 'evap', e: '💧', l: 'تبخّر الماء' }, { k: 'vapor', e: '💨', l: 'بخار في الهواء' },
      { k: 'cloud', e: '☁️', l: 'سحب' }, { k: 'rain', e: '🌧️', l: 'مطر' }, { k: 'lake', e: '🏞️', l: 'مياه البحيرة' }
    ];
    var chainHtml = NODES.map(function (n, i) {
      return (i ? '<span class="arr" aria-hidden="true">←</span>' : '') +
        '<div class="cnode" data-n="' + n.k + '"><span class="e" aria-hidden="true">' + n.e + '</span>' +
        (plan.hard ? '' : '<span class="l">' + n.l + '</span>') + '<span class="mbar"><i></i></span><span class="w">—</span></div>';
    }).join('');

    main.innerHTML =
      '<section class="mission screen">' +
      '<div class="alert" data-alert role="status"><span aria-hidden="true" style="font-size:1.4rem">🚨</span><div><h2>حدث خلل في الدورة!</h2><p>اجعل المطر يهطل من جديد.</p></div></div>' +
      '<div class="card cycle-chain" aria-label="سلسلة دورة المياه الآن">' + chainHtml + '</div>' +
      '<div class="grid">' +
      '<div class="panel">' +
      '<div class="card weather" style="padding:18px"><h3><span aria-hidden="true">🎛️</span> أنت تتحكم في الطقس</h3>' +
      (plan.hard ? '<span class="tag challenge">⬆ مستوى أعلى: ثلاثة أعطال، ودون أسماء للمراحل</span>' : '<span class="tag support">اخترنا الأعطال من المراحل التي احتجت فيها إلى دعم</span>') +
      '<div data-sliders style="display:grid;gap:10px"></div>' +
      '<div class="row"><button class="btn small ghost" type="button" data-hint>💧 أحتاج إلى تلميح</button></div></div>' +
      '<div data-explain></div>' +
      '</div>' +
      '<figure class="card stage" style="margin:0"><canvas role="img" aria-label="محاكاة دورة المياه: شمس، بحيرة، بخار، سحابة، مطر، ونهر يعود إلى البحيرة"></canvas>' +
      '<figcaption class="caption"><span data-live aria-live="polite"></span><span class="muted">التغيير ينتقل من حلقة إلى أخرى ببطء… راقب السلسلة.</span></figcaption></figure>' +
      '</div></section>';

    var $ = function (s) { return main.querySelector(s); };
    var sim = new WC.CycleSim($('canvas'), ctrl).start();
    var SL = [
      { k: 'sun', label: '☀️ حرارة الشمس', ends: ['ضعيفة', 'قوية'], cls: 'sun-track' },
      { k: 'air', label: '🌡️ درجة حرارة الهواء', ends: ['دافئ', 'بارد'], cls: 'cold-track' },
      { k: 'vapor', label: '💨 كمية بخار الماء', ends: ['قليلة', 'كثيرة'] },
      { k: 'size', label: '💧 حجم قطرات الماء', ends: ['صغيرة', 'كبيرة'] }
    ];
    var sliders = {};
    SL.forEach(function (d) {
      var prev = ctrl[d.k];
      var s = UI.slider({ id: 'm-' + d.k, label: d.label, value: ctrl[d.k], ends: d.ends, cls: d.cls || '',
        onInput: function (v) { sim.set(d.k, v); },
        onChange: function (v) {
          if (done) return;
          L.mission.changes++; sinceHint++;
          L.mission.changeLog.push({ k: d.k, label: d.label.replace(/^\S+\s/, ''), from: prev, to: v });
          prev = v;
        } });
      sliders[d.k] = s; $('[data-sliders]').appendChild(s.node);
    });

    function hint(manual) {
      var s = sim.s, block = E.missionBlock(s);
      tier = Math.min(2, tier + 1);
      E.missionHint(L, block, tier);
      var text = K.missionHints[block || 'none'][tier - 1];
      N.say({ kind: manual ? 'hint' : 'question', text: text });
      sinceHint = 0; lastHintAt = performance.now();
      if (tier >= 2 && !plan.hard && block) {
        var map = { evaporation: s.evap < 0.45 ? 'evap' : 'vapor', condensation: 'cloud', precipitation: 'rain' };
        main.querySelectorAll('.cnode').forEach(function (n) { n.classList.toggle('blocked', n.dataset.n === map[block]); });
      }
    }
    $('[data-hint]').onclick = function () { hint(true); };

    var lastT = performance.now();
    var tick = setInterval(function () {
      var now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
      var s = sim.s;
      NODES.forEach(function (n) {
        var v = n.k === 'lake' ? s.lake : s[n.k], node = main.querySelector('[data-n=' + n.k + ']');
        node.querySelector('i').style.width = Math.round(v * 100) + '%';
        node.querySelector('.w').textContent = UI.level3(v, ['ضعيف', 'متوسط', 'قوي']);
        node.querySelector('.e').style.transform = 'scale(' + (0.85 + v * 0.35) + ')';
      });
      $('[data-live]').textContent = s.rain > 0.05 ? '🌧️ المطر يهطل، والبحيرة تمتلئ' : '☁️ لا مطر بعد';
      if (done) return;
      hold = s.rain >= RM.successRain ? hold + dt : 0;
      if (hold >= RM.successHold) return succeed();
      var idle = (now - lastHintAt) / 1000;
      if (sinceHint >= hintEvery || (idle >= RM.hintIdleSeconds && L.mission.changes > 0)) hint(false);
    }, 250);

    function succeed() {
      done = true; E.missionSuccess(L); N.hide();
      main.querySelectorAll('.cnode').forEach(function (n) { n.classList.remove('blocked'); });
      var a = $('[data-alert]'); a.classList.add('ok');
      a.innerHTML = '<span aria-hidden="true" style="font-size:1.4rem">🎉</span><div><h2>نجحت في إعادة تشغيل الدورة!</h2><p>عاد المطر، وبدأت البحيرة تمتلئ من جديد.</p></div>';
      WC.Audio.chime(); WC.Audio.speak('نجحت في إعادة تشغيل الدورة!');
      explain();
    }

    /* ---------- explanation: your changes → causal chain → collection ---------- */
    function explain() {
      var host = $('[data-explain]');
      var changes = [];
      SL.forEach(function (d) {
        if (sliders[d.k].value !== start[d.k]) changes.push('<li>' + d.label.replace(/^\S+\s/, '') + ': من ' + ar.pct(start[d.k]) + ' إلى ' + ar.pct(sliders[d.k].value) + '</li>');
      });
      var box = UI.h('<div class="card step-block" style="padding:18px">' +
        '<h3>اشرح كيف أدت تغييراتك إلى عودة المطر.</h3>' +
        '<div><b style="font-size:.9rem">ما غيّرتَه:</b><ul class="changes">' + (changes.join('') || '<li>انتظرتَ حتى استقرّت الدورة</li>') + '</ul></div>' +
        '<p class="muted" style="font-size:.92rem">رتّب ما حدث بالضغط على البطاقات بالترتيب الصحيح:</p>' +
        '<div class="order-cards"></div>' +
        '<div class="row"><button class="btn small ghost" type="button" data-reset>إعادة الترتيب</button></div>' +
        '<div class="feedback" data-cfb></div>' +
        '<div class="step-block" data-words hidden><label for="own" style="font-weight:700">اشرح بكلماتك (اختياري):</label><textarea id="own" placeholder="مثلًا: عندما رفعتُ…"></textarea></div>' +
        '<div data-coll></div></div>');
      host.appendChild(box);
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var order = [], chainErrors = 0, right = ['evaporation', 'condensation', 'precipitation', 'collection'];
      var cards = box.querySelector('.order-cards'), cfb = box.querySelector('[data-cfb]');
      K.chain.forEach(function (c) {
        var b = UI.h('<button type="button"><span class="num" aria-hidden="true">·</span><span>' + c.text + '</span></button>');
        b.onclick = function () {
          if (b.classList.contains('picked') || order.length >= 4) return;
          order.push(c.id); b.classList.add('picked'); b.querySelector('.num').textContent = ar.digits(order.length);
          b.setAttribute('aria-label', 'الخطوة ' + ar.digits(order.length) + ': ' + c.text);
          if (order.length === 4) checkOrder();
        };
        cards.appendChild(b);
      });
      function reset() { order = []; cards.querySelectorAll('button').forEach(function (b) { b.classList.remove('picked'); b.querySelector('.num').textContent = '·'; b.disabled = false; b.removeAttribute('aria-label'); }); }
      box.querySelector('[data-reset]').onclick = reset;
      function checkOrder() {
        var bad = order.findIndex(function (id, i) { return id !== right[i]; });
        if (bad === -1) {
          cards.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          box.querySelector('[data-reset]').hidden = true;
          UI.feedback(cfb, 'good', 'سلسلة صحيحة', 'تبخّر ← تكاثف ← هطول ← تجمّع: كل تغيير قاد إلى الذي بعده.');
          L.addTimeline(chainErrors ? 'sup' : 'ok', chainErrors ? 'رتّب سلسلة الدورة بعد محاولة إضافية' : 'رتّب سلسلة الدورة من أول محاولة');
          box.querySelector('[data-words]').hidden = false;
          collection();
        } else {
          chainErrors++;
          var prevTxt = bad === 0 ? 'البداية' : '«' + WC.CONCEPTS[order[bad - 1]].name + '»';
          UI.feedback(cfb, 'near', 'راجع الحلقة رقم ' + ar.digits(bad + 1), 'ماذا يجب أن يحدث بعد ' + prevTxt + '؟ تذكّر: لا مطر دون سحابة، ولا سحابة دون بخار.');
          setTimeout(reset, 900);
        }
      }

      function collection() {
        var host2 = box.querySelector('[data-coll]');
        var cq, qfb = UI.h('<div class="feedback"></div>');
        var Kc = K.collection;
        cq = new UI.Question(host2, { id: 'collection', prompt: Kc.prompt, options: Kc.options, onAnswer: function (opt) {
          var d = E.answer(L, 'collection', opt);
          if (opt.correct) {
            cq.markRight(opt.id); N.hide();
            UI.feedback(qfb, 'good', 'استنتاج دقيق', opt.fb);
            host2.appendChild(UI.discovery('collection'));
            var fin = UI.h('<div class="row end"><button class="btn" type="button">اعرض خريطة تعلّمي <span class="arrow" aria-hidden="true">➜</span></button></div>');
            fin.querySelector('button').onclick = function () {
              L.explanation = { text: box.querySelector('#own').value.trim(), chainErrors: chainErrors };
              app.go('map');
            };
            host2.appendChild(fin);
            return;
          }
          cq.markTried(opt.id);
          UI.feedback(qfb, 'near', 'اقتربت…', opt.fb);
          if (d.action === 'extra') {
            N.say({ kind: 'why', text: 'لاحظتُ أن مسار ماء المطر بعد سقوطه يحتاج إلى متابعة، لذلك سأجعل المطر يهطل بقوة. تتبّع النهر والبحيرة في المشهد.' });
            sliders.sun.set(85, true); sliders.air.set(90, true); sliders.vapor.set(90, true); sliders.size.set(90, true);
          } else {
            cq.reduceTo(d.keep, d.action === 'guided');
            N.say({ kind: 'scaffold', text: 'انظر إلى النهر في المشهد: إلى أين يحمل ماء المطر؟ وماذا تفعل الشمس بماء البحيرة بعد ذلك؟' });
          }
        } });
        host2.appendChild(qfb);
      }
    }

    var intro = setTimeout(function () {
      if (tier > 0 || done) return;
      N.say({ kind: 'question', text: plan.hard
        ? 'هذه مهمة لمن أتقن المراحل كلها: ثلاث حلقات معطّلة. لن أتدخل إلا إذا طال البحث أو طلبتَ تلميحًا.'
        : 'لاحظتُ في رحلتك ما احتاج إلى دعم، فجعلتُ الخلل هناك. أين تتوقف السلسلة؟ راقبها في الأعلى.', timeout: 9000 });
    }, 800);

    return function () { clearInterval(tick); clearTimeout(intro); sim.stop(); };
  }
};

</script>
<script>
/* map.js — «خريطة تعلمي»: learning states, not a score. */
window.WC = window.WC || {}; WC.Screens = WC.Screens || {};

WC.Screens.map = {
  rail: 7,
  mount: function (main, app) {
    var UI = WC.UI, E = WC.Engine, L = app.learner, C = WC.CONCEPTS;

    function trail(k) {
      var items = [];
      if (k === 'evaporation' && L.diagnostic) items.push(L.diagnostic === 'vapor' ? 'بدأ بتوقّع صحيح' : 'بدأ بتوقّع يحتاج إلى اختبار');
      L.log.forEach(function (e) {
        if (e.concept === k) {
          if (e.action === 'extra') items.push('تجربة إضافية: ' + C[k].extra);
          else if (e.action === 'scaffold') items.push('سقالة من نُقطة وخيارات أقل');
          else if (e.action === 'guided') items.push('عرض موجّه خطوة بخطوة');
          else if (e.action === 'challenge') items.push('استنتج من أول محاولة ← رُفع مستوى التحدي');
          else if (e.action === 'advance') items.push(L.c[k].errors ? 'استنتج المفهوم بعد الدعم' : 'استنتج المفهوم من أول محاولة');
          else if (e.action === 'challenge-result') items.push(L.c[k].challenge === 'passed' ? 'اجتاز التحدي الأعلى' : 'التحدي الأعلى: يحتاج إلى محاولة أخرى');
        }
        if (e.concept === 'mission' && e.action === 'hint' && e.diagnosis.indexOf(C[k].name) > -1) items.push('تلميح موجّه في المهمة النهائية');
      });
      if (k !== 'collection' && L.mission.faults.indexOf(k) > -1 && L.mission.success) items.push('أصلح هذه الحلقة في المهمة النهائية');
      return items.length ? items : ['لم تبدأ هذه المرحلة بعد'];
    }

    var cards = WC.CONCEPT_ORDER.map(function (k) {
      var st = E.status(L, k);
      return '<article class="card concept"><div class="top"><span class="ico" aria-hidden="true">' + C[k].icon + '</span>' +
        '<span class="status ' + st.key + '"><span class="shape" aria-hidden="true">' + (st.emoji || st.shape) + '</span>' + st.label + '</span></div>' +
        '<h3>' + C[k].name + '</h3><ul class="trail">' + trail(k).map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></article>';
    }).join('');

    var line = L.timeline.map(function (t) { return '<li class="' + (t.kind === 'sup' ? 'sup' : t.kind === 'ch' ? 'ch' : t.kind === 'ok' ? 'ok' : '') + '">' + t.text + '</li>'; }).join('');
    var own = L.explanation && L.explanation.text ? '<div class="card journey-line"><b>شرحك بكلماتك</b><p>«' + UI.esc(L.explanation.text) + '»</p></div>' : '';

    main.innerHTML =
      '<section class="map screen">' +
      '<header><span class="eyebrow">' + (L.name === 'أنت' ? 'رحلتك' : 'رحلة ' + L.name) + '</span><h2><span aria-hidden="true">🌧️</span> خريطة تعلّمي</h2>' +
      '<p class="quote">هذه الخريطة لا تصف نتيجتك فقط، بل تصف كيف تعلّمت.</p></header>' +
      '<div class="concepts">' + cards + '</div>' +
      '<div class="card journey-line"><b>مسار رحلتك كما بناه النظام</b><ol>' + (line || '<li>لم تبدأ الرحلة بعد</li>') + '</ol>' +
      '<small class="muted">● متقن · ◐ أتقن بعد دعم · ○ يحتاج إلى تحدٍ إضافي — الحالة مكتوبة دائمًا، ولا تعتمد على اللون وحده.</small></div>' +
      own +
      '<p class="closing">لم نصمم درسًا رقميًا عن دورة المياه، بل صممنا بيئة تتغير عندما يتغير المتعلم.</p>' +
      '<div class="center-row"><button class="btn" type="button" data-adapt>كيف تكيّفت رحلتي؟ <span class="arrow" aria-hidden="true">➜</span></button>' +
      '<button class="btn ghost" type="button" data-again>ابدأ رحلة جديدة</button></div>' +
      '<div class="center-row"><button class="designer-link" type="button" data-designer>عرض منطق التصميم</button></div>' +
      '</section>';
    main.querySelector('[data-adapt]').onclick = function () { app.go('adapt'); };
    main.querySelector('[data-again]').onclick = function () { app.restart(); };
  }
};

</script>
<script>
/* adapt.js — «كيف تكيفت رحلتي؟»: reveals the system's logic using the learner's REAL decision log,
   then compares it with sample learners run through the same engine. */
window.WC = window.WC || {}; WC.Screens = WC.Screens || {};

WC.Screens.adapt = {
  rail: 7,
  mount: function (main, app) {
    var L = app.learner, C = WC.CONCEPTS, ar = WC.ar;
    var FLOW = [
      ['استجابة المتعلم', 'ما تختاره وما تجرّبه في المحاكاة'],
      ['تشخيص الفهم', 'ماذا تكشف الاستجابة عن تفكيرك؟'],
      ['تحديد الاحتياج', 'أي علاقة تحتاج إلى اكتشاف؟'],
      ['اختيار النشاط', 'تجربة إضافية، سقالة، أو تحدٍّ أعلى'],
      ['التغذية الراجعة', 'فورية، لطيفة، ومرتبطة بالمفهوم'],
      ['إعادة التقييم', 'هل تحسّن الفهم؟ ثم تبدأ الدورة من جديد']
    ];
    var flow = FLOW.map(function (f, i) {
      return (i ? '<div class="down" aria-hidden="true">↓</div>' : '') +
        '<div class="fstep" data-f="' + i + '"><span class="i">' + ar.digits(i + 1) + '</span><span>' + f[0] + '<small>' + f[1] + '</small></span></div>';
    }).join('');

    // pick the most informative real decisions: support first, then challenges, then the diagnosis
    var weight = { guided: 6, scaffold: 5, extra: 5, hint: 4, 'mission-plan': 3, challenge: 3, 'challenge-result': 2 };
    var picked = L.log.filter(function (e) { return weight[e.action] || e.concept === 'diagnostic'; })
      .sort(function (a, b) { return (weight[b.action] || 1) - (weight[a.action] || 1) || a.id - b.id; }).slice(0, 4)
      .sort(function (a, b) { return a.id - b.id; });
    var cases = picked.map(function (e) { return caseCard(e, false); }).join("");
    if (!cases) {
      cases = caseCard({ concept: 'condensation', response: 'أخطأ في التكاثف مرتين.', diagnosis: 'حدد أن المفهوم يحتاج إلى دعم.',
        decision: 'تقديم تجربة التحكم بدرجة الحرارة.', result: 'تحسّن الأداء.' }, true);
    }
    function caseCard(e, demo) {
      var title = e.concept === 'diagnostic' ? 'التشخيص الأولي' : e.concept === 'mission' ? 'المهمة النهائية' : C[e.concept].name;
      return '<article class="card case"><div class="row" style="justify-content:space-between"><b>' + title + '</b>' +
        (demo ? '<span class="tag">مثال توضيحي</span>' : '<span class="tag">قرار حقيقي من رحلتك</span>') + '</div>' +
        '<div class="grid4"><div class="cell"><span>المتعلم</span>' + e.response + '</div>' +
        '<div class="cell"><span>النظام</span>' + e.diagnosis + '</div>' +
        '<div class="cell"><span>القرار</span>' + e.decision + '</div>' +
        '<div class="cell res' + (e.result ? '' : ' pend') + '"><span>النتيجة</span>' + (e.result || 'قيد المتابعة') + '</div></div></article>';
    }

    function journey(Lx, title, blurb, mine) {
      var steps = Lx.timeline.map(function (t) {
        var cls = t.kind === 'sup' ? 'sup' : t.kind === 'ch' ? 'ch' : '';
        var lab = t.kind === 'sup' ? 'دعم' : t.kind === 'ch' ? 'تحدٍّ' : 'تقدّم';
        return '<li class="' + cls + '"><b>' + lab + '</b><span>' + t.text + '</span></li>';
      }).join('');
      var states = WC.CONCEPT_ORDER.map(function (k) { var s = WC.Engine.status(Lx, k); return C[k].name + ': ' + s.label; }).join(' · ');
      return '<article class="card persona"' + (mine ? ' style="border-color:var(--water)"' : '') + '><h4>' + title + '</h4><p class="muted" style="font-size:.88rem">' + blurb + '</p>' +
        '<ol class="steps">' + (steps || '<li><b>—</b><span>لم تبدأ الرحلة بعد</span></li>') + '</ol><small class="muted">' + states + '</small></article>';
    }
    var personas = journey(L, L.name === 'أنت' ? 'رحلتك أنت' : 'رحلة ' + L.name, 'الرحلة التي بناها النظام من استجاباتك', true) +
      WC.PERSONAS.map(function (p) { return journey(WC.simulatePersona(p), p.name + ' (متعلم تجريبي)', p.blurb); }).join('');

    main.innerHTML =
      '<section class="adapt screen">' +
      '<header><span class="eyebrow">خلف الكواليس</span><h2>كيف تكيّفت رحلتي؟</h2>' +
      '<p class="muted" style="max-width:56ch">في كل خطوة، يقرأ النظام استجابتك، ويقرّر النشاط التالي. هذه هي القرارات التي اتخذها فعلًا في رحلتك.</p></header>' +
      '<div class="two"><div class="card flow" aria-label="دورة القرار التكيفي">' + flow + '</div>' +
      '<div class="cases"><div class="section-title"><h3>أمثلة من رحلتك</h3><p class="muted" style="font-size:.9rem">المتعلم ← النظام ← القرار ← النتيجة</p></div>' + cases + '</div></div>' +
      '<div class="section-title"><h3>نفس الهدف… رحلات تعلم مختلفة</h3><p class="muted" style="font-size:.9rem">المتعلمون التجريبيون مرّوا بالمحرك التكيفي نفسه، بإجابات مختلفة، فحصل كلٌّ منهم على مسار مختلف.</p></div>' +
      '<div class="personas">' + personas + '</div>' +
      '<p class="closing">لم نصمم درسًا رقميًا عن دورة المياه، بل صممنا بيئة تتغير عندما يتغير المتعلم.</p>' +
      '<div class="center-row"><button class="btn ghost" type="button" data-map>العودة إلى خريطة تعلّمي</button><button class="btn ghost" type="button" data-again>ابدأ رحلة جديدة</button></div>' +
      '<div class="center-row"><button class="designer-link" type="button" data-designer>عرض منطق التصميم</button></div>' +
      '</section>';

    // light the decision cycle step by step (motion here only emphasises the sequence)
    var i = 0, steps = main.querySelectorAll('.fstep');
    var t = setInterval(function () { steps.forEach(function (s, j) { s.classList.toggle('lit', j === i); }); i = (i + 1) % steps.length; }, 1400);
    main.querySelector('[data-map]').onclick = function () { app.go('map'); };
    main.querySelector('[data-again]').onclick = function () { app.restart(); };
    return function () { clearInterval(t); };
  }
};

</script>
<script>
/* designer.js — «عرض منطق التصميم»: a panel for academic supervisors.
   Shows the frameworks, the live rules (read from WC.RULES), the live decision log,
   and quick tools for a demo (jump to a screen, load a sample learner). */
window.WC = window.WC || {};

WC.Designer = (function () {
  var dlg;
  function rulesTable() {
    var R = WC.RULES, C = WC.CONCEPTS, ar = WC.ar;
    var rows = [
      ['التشخيص الأولي', 'اختيار «يبقى الماء كما هو» أو «يتحول مباشرة إلى مطر»', 'بدء مختبر الشمس بأداة المقارنة وتوجيه من نُقطة', 'RULES.diagnostic'],
      ['أول خطأ في مفهوم', 'عدد الأخطاء = ' + ar.digits(R.ladder.extraAt), 'تجربة إضافية خاصة بالمفهوم (مقارنة، تبريد بطيء، مقياس الثقل)', 'RULES.ladder.extraAt'],
      ['تكرار الخطأ', 'عدد الأخطاء = ' + ar.digits(R.ladder.scaffoldAt), 'سقالة من نُقطة + إخفاء الخيارات المستبعدة (' + ar.digits(R.ladder.scaffoldKeep) + ' على الأكثر)', 'RULES.ladder.scaffoldAt'],
      ['خطأ ثالث', 'عدد الأخطاء = ' + ar.digits(R.ladder.guidedAt), 'عرض موجّه تضبط فيه نُقطة التجربة، ثم خياران', 'RULES.ladder.guidedAt'],
      ['إتقان من أول محاولة', 'لا أخطاء في المفهوم', 'لا إعادة للشرح + تحدٍّ أعلى (سؤال نقل أو مهمة أصعب)', 'RULES.challengeOnFirstTry'],
      ['احتاج التبخر إلى دعم', 'أخطاء في التبخر', 'تذكير قصير في بداية مختبر السحب (ويُحذف لمن أتقن)', 'RULES.recapIfErrorsIn'],
      ['احتاج التكاثف إلى دعم', 'أخطاء في التكاثف', 'مقياس الثقل يظهر من بداية مختبر المطر', 'RULES.supportFromPrior'],
      ['المهمة النهائية', 'المفاهيم التي فيها أخطاء', 'تصبح هي الأعطال؛ ومن أتقن كل شيء يواجه ثلاثة أعطال دون أسماء للمراحل', 'RULES.mission'],
      ['تعثّر في المهمة', 'تغيير المتغيرات ' + ar.digits(R.mission.hintEveryChanges.normal) + ' مرات دون مطر، أو ' + ar.digits(R.mission.hintIdleSeconds) + ' ثانية', 'تشخيص الحلقة المتوقفة من حالة المحاكاة ← تلميح موجّه عنها', 'Engine.missionBlock']
    ];
    return '<table class="rules"><thead><tr><th>الموقف</th><th>الشرط</th><th>القرار</th><th>في الكود</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td><code>' + r[3] + '</code></td></tr>'; }).join('') + '</tbody></table>';
  }
  function logList(app) {
    var C = WC.CONCEPTS, log = app.learner.log;
    if (!log.length) return '<li>لا توجد قرارات بعد. ابدأ الرحلة، ثم افتح هذه اللوحة من جديد.</li>';
    return log.map(function (e) {
      var who = e.concept === 'diagnostic' ? 'التشخيص' : e.concept === 'mission' ? 'المهمة' : C[e.concept].name;
      return '<li>[' + WC.ar.digits(e.id) + '] ' + who + ' — ' + e.response + ' ← ' + e.decision + (e.result ? ' ← ' + e.result : '') + '</li>';
    }).join('');
  }
  function open(app) {
    if (!dlg) { dlg = document.createElement('dialog'); dlg.className = 'designer'; document.body.appendChild(dlg); }
    var screens = [['gate', 'البوابة'], ['diag', 'التشخيص'], ['evap', 'مختبر الشمس'], ['cloud', 'مختبر السحب'], ['rain', 'مختبر المطر'], ['mission', 'المهمة'], ['map', 'خريطة التعلم'], ['adapt', 'كيف تكيفت رحلتي؟']];
    dlg.innerHTML =
      '<div class="dz"><header><h2>كيف صممنا هذه البيئة؟</h2><button class="tool" type="button" data-close aria-label="إغلاق">✕ <span class="t">إغلاق</span></button></header>' +
      '<div class="body">' +
      '<div class="fw">' +
      '<div class="f"><b>ADDIE</b><p>الإطار العام لتصميم البيئة: تحليل ← تصميم ← تطوير ← تنفيذ ← تقويم.</p></div>' +
      '<div class="f"><b>Adaptive Learning</b><p>تكييف مسار التعلم بناءً على استجابة المتعلم: النشاط التالي ومستوى الدعم يتغيّران وفق ما يُظهره المتعلم.</p></div>' +
      '<div class="f"><b>UDL</b><p>تقديم أكثر من طريقة للمشاركة والفهم والتفاعل: نص وصوت اختياري، رموز مع كلمات، مؤشرات لفظية بجانب الحركة، لوحة مفاتيح، وتكبير الخط.</p></div>' +
      '<div class="f"><b>الاستقصاء</b><p>الطالب يغيّر المتغيرات ويلاحظ النتائج ويستنتج العلاقات؛ المصطلح العلمي يظهر بعد الاكتشاف لا قبله.</p></div>' +
      '</div>' +
      '<div class="section-title"><h3>قواعد التكيّف (تُقرأ من الكود مباشرة)</h3><p class="muted" style="font-size:.88rem">كل القواعد في كائن واحد قابل للتعديل: <code style="direction:ltr;unicode-bidi:isolate">js/core/adaptive.js → WC.RULES</code></p></div>' +
      rulesTable() +
      '<div class="section-title"><h3>سجل القرارات الحي لهذه الرحلة</h3></div><ol class="livelog">' + logList(app) + '</ol>' +
      '<div class="section-title"><h3>أدوات العرض</h3><p class="muted" style="font-size:.88rem">للانتقال السريع أثناء العرض، أو لتحميل رحلة متعلم تجريبي مرّت بالمحرك نفسه.</p></div>' +
      '<div class="jump">' + screens.map(function (s) { return '<button class="tool" type="button" data-go="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>' +
      '<div class="jump">' + WC.PERSONAS.map(function (p) { return '<button class="btn small ghost" type="button" data-persona="' + p.id + '">حمّل رحلة ' + p.name + ': ' + p.blurb + '</button>'; }).join('') + '</div>' +
      '</div></div>';
    dlg.querySelector('[data-close]').onclick = function () { dlg.close(); };
    dlg.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { dlg.close(); app.go(b.dataset.go); }; });
    dlg.querySelectorAll('[data-persona]').forEach(function (b) {
      b.onclick = function () {
        var p = WC.PERSONAS.find(function (x) { return x.id === b.dataset.persona; });
        app.learner = WC.simulatePersona(p); dlg.close(); app.go('map');
      };
    });
    dlg.showModal();
  }
  return { open: open };
})();

</script>
<script>
/* app.js — router, top bar, UDL tools. */
window.WC = window.WC || {};

WC.App = (function () {
  var RAIL = [['gate', 'البوابة'], ['diag', 'التشخيص'], ['evap', 'الشمس'], ['cloud', 'السحب'], ['rain', 'المطر'], ['mission', 'المهمة']];
  var main, bar, cleanup = null, current = null;

  var app = {
    learner: new WC.Learner(),
    go: function (id) {
      var S = WC.Screens[id] || WC.Screens.gate;
      if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } }
      WC.Nuqta.hide(); WC.Audio.stop();
      current = id;
      main.innerHTML = '';
      bar.hidden = id === 'gate';
      paintRail(S.rail);
      cleanup = S.mount(main, app) || null;
      window.scrollTo(0, 0);
      if (id !== 'gate') main.focus({ preventScroll: true });
      if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    },
    restart: function () { app.learner = new WC.Learner(); app.go('gate'); },
    get current() { return current; }
  };

  function paintRail(step) {
    bar.querySelector('.rail').innerHTML = RAIL.map(function (r, i) {
      var n = i + 1, cls = n < step ? 'done' : n === step ? 'now' : '';
      return '<li class="' + cls + '"' + (n === step ? ' aria-current="step"' : '') + '><span class="n">' + (n < step ? '✓' : WC.ar.digits(n)) + '</span><span class="t">' + r[1] + '</span></li>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    main = document.getElementById('main');
    bar = document.getElementById('topbar');
    var snd = document.getElementById('t-sound'), txt = document.getElementById('t-text');
    if (!WC.Audio.supported) snd.hidden = true;
    snd.onclick = function () {
      var on = WC.Audio.toggle(); snd.setAttribute('aria-pressed', on);
      snd.querySelector('.t').textContent = on ? 'الصوت يعمل' : 'الصوت';
      if (on) WC.Audio.speak('تم تشغيل الصوت. ستقرأ نُقطة رسائلها بصوت مسموع.');
    };
    txt.onclick = function () {
      var lg = document.documentElement.dataset.text !== 'lg';
      document.documentElement.dataset.text = lg ? 'lg' : '';
      txt.setAttribute('aria-pressed', lg);
    };
    document.getElementById('t-restart').onclick = function () { app.restart(); };
    document.addEventListener('click', function (e) { if (e.target.closest('[data-designer]')) WC.Designer.open(app); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') WC.Nuqta.hide();
      if (e.shiftKey && (e.key === 'D' || e.key === 'ي') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) WC.Designer.open(app);
    });
    var start = location.hash.slice(1);
    // deep links are for demos; without a journey, labs still work with a fresh learner model
    app.go(WC.Screens[start] ? start : 'gate');
  });

  return app;
})();

</script>
