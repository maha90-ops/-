:root{
  color-scheme: light;
  /* surfaces & ink */
  --bg:#EDF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --line:#D8E2EB;
  --ink:#0F2236; --muted:#4F6378; --faint:#7D90A3;
  /* identity */
  --primary:#0E4A6B; --primary-2:#13628C; --on-primary:#FFFFFF;
  --water:#2B86BA; --water-soft:#E0EFF7;
  --sun:#E9982B; --sun-soft:#FCEED8;
  --cloud:#8A9DB0;
  /* learning states (always paired with text + shape) */
  --ok:#1F7F54;   --ok-soft:#DDF0E6;
  --mid:#A8700F;  --mid-soft:#FAEFD6;
  --need:#B9502F; --need-soft:#F8E2DA;
  --focus:#F2B33D;
  --shadow-1:0 1px 2px rgba(15,34,54,.06),0 6px 20px rgba(15,34,54,.06);
  --shadow-2:0 2px 6px rgba(15,34,54,.08),0 18px 48px rgba(15,34,54,.12);
  --f-display:"Kufi Display","Plex Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"Plex Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --fs:17px; --r:20px; --r-sm:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-text="lg"]{ --fs:20px; }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:var(--fs); line-height:1.75;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--f-display);line-height:1.45;margin:0;font-weight:700;letter-spacing:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none}
.skip:focus{top:12px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:10px clamp(16px,3vw,32px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar[hidden]{display:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--primary);white-space:nowrap}
.brand svg{width:24px;height:24px}
.rail{display:flex;gap:6px;list-style:none;margin:0;padding:0;justify-content:center;flex-wrap:wrap}
.rail li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);padding:4px 10px;border-radius:999px;white-space:nowrap}
.rail li .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;line-height:1}
.rail li.done{color:var(--ok)}
.rail li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rail li.now{color:var(--primary);background:var(--water-soft);font-weight:700}
.rail li.now .n{background:var(--primary);border-color:var(--primary);color:#fff}
.tools{display:flex;gap:6px}
.tool{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;
  border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:14px;color:var(--muted)
}
.tool:hover{border-color:var(--water);color:var(--primary)}
.tool[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}

main{min-height:calc(100vh - 62px);outline:none}
.screen{animation:screenIn .6s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:980px){
  .rail li .t{display:none}
  .rail li.now .t{display:inline}
}
@media (max-width:640px){
  .topbar{grid-template-columns:1fr auto;gap:8px}
  .brand span{display:none}
  .topbar nav{grid-column:1/-1;grid-row:2}
  .rail{justify-content:flex-start;gap:2px}
  .rail li{padding:4px 6px}
  .tool .t{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.flow .fstep .i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;font-size:.9rem;flex:none}
.flow .fstep small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.flow .down{text-align:center;color:var(--faint);line-height:1.6}
.flow .fstep.lit{background:var(--water-soft);border-color:var(--water)}
.cases{display:grid;gap:14px}
.case{padding:18px;display:grid;gap:10px}
.case .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.case .cell{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;gap:4px;font-size:.88rem}
.case .cell span{font-size:.74rem;font-weight:700;color:var(--water)}
.case .cell.res{background:var(--ok-soft);border-color:transparent}
.case .cell.res span{color:var(--ok)}
.case .cell.res.pend{background:var(--surface-2)}
.case .cell.res.pend span{color:var(--faint)}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.persona{padding:18px;display:grid;gap:10px;align-content:start}
.persona h4{margin:0;font-family:var(--f-display);font-size:1.05rem}
.persona .steps{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:.85rem}
.persona .steps li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.persona .steps li b{color:var(--primary);font-weight:700}
.persona .steps li.sup{background:var(--mid-soft)}
.persona .steps li.ch{background:var(--sun-soft)}
.section-title{display:grid;gap:4px}
.section-title h3{font-size:1.2rem}

/* ---------- designer dialog content ---------- */
.dz{display:grid;gap:0}
.dz header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dz header h2{font-size:1.3rem}
.dz .body{padding:22px 24px;display:grid;gap:22px}
.fw{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fw .f{padding:16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:grid;gap:6px}
.fw .f b{font-family:var(--f-body);font-size:1.05rem;color:var(--primary);direction:ltr;text-align:right}
.fw .f p{font-size:.9rem;color:var(--muted)}
.rules{width:100%;border-collapse:collapse;font-size:.86rem}
.rules th,.rules td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.rules th{background:var(--surface-2);color:var(--muted)}
.rules code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;direction:ltr;unicode-bidi:isolate;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.livelog{max-height:220px;overflow:auto;margin:0;padding:12px;border-radius:12px;background:#0F2236;color:#CFE3F1;font-size:.82rem;line-height:1.7;list-style:none}
.livelog li{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.dz .jump{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .lab,.mission .grid,.diag,.adapt .two{grid-template-columns:1fr}
  .stage{position:relative;top:0;order:-1}
  .diag .scene{order:-1}
  .cycle-chain{grid-template-columns:repeat(6,1fr);row-gap:10px}
  .cycle-chain .arr{display:none}
  .case .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .cycle-chain{grid-template-columns:repeat(3,1fr)}
  .steps4{grid-template-columns:1fr 1fr}
  .case .grid4{grid-template-columns:1fr}
}

<script>
/* arabic.js — Eastern Arabic numerals for every learner-facing number. */
window.WC = window.WC || {};

WC.ar = (function () {
  var D = '٠١٢٣٤٥٦٧٨٩';
  function digits(v) {
    return String(v).replace(/[0-9]/g, function (d) { return D[+d]; }).replace(/\./g, '٫');
  }
  return {
    digits: digits,
    /** 45 → "٤٥٪" */
    pct: function (v) { return digits(Math.round(v)) + '٪'; },
    /** 18 → "١٨°" */
    deg: function (v) { return digits(Math.round(v)) + '°'; },
    /** ordinal word for 1..6 used in UI copy */
    times: function (n) {
      if (n === 1) return 'مرة واحدة';
      if (n === 2) return 'مرتين';
      return digits(n) + (n <= 10 ? ' مرات' : ' مرة');
    }
  };
})();

</script>
<script>
/* state.js — the learner model.
   Everything the adaptive engine knows about the learner lives here.
   Nothing is stored on a server; the model lives in memory for one journey. */
window.WC = window.WC || {};

WC.CONCEPT_ORDER = ['evaporation', 'condensation', 'precipitation', 'collection'];

WC.CONCEPTS = {
  evaporation:   { name: 'التبخر',  icon: '💨', lab: 'evap',
                   need: 'الربط بين حرارة الشمس وتحوّل الماء إلى بخار',
                   extra: 'تجربة مقارنة بين حرارة منخفضة وحرارة مرتفعة',
                   definition: 'تحوّل الماء من سائل إلى بخار عندما يسخن.' },
  condensation:  { name: 'التكاثف', icon: '☁️', lab: 'cloud',
                   need: 'الربط بين برودة الهواء وتحوّل البخار إلى قطرات',
                   extra: 'تجربة التبريد البطيء والتحكم بدرجة حرارة الهواء',
                   definition: 'تحوّل بخار الماء إلى قطرات صغيرة عندما يبرد، فتتكوّن السحب.' },
  precipitation: { name: 'الهطول',  icon: '🌧️', lab: 'rain',
                   need: 'الربط بين كِبَر القطرات وثقلها وسقوطها',
                   extra: 'مقياس «ثقل القطرة ودفع الهواء»',
                   definition: 'سقوط الماء من السحب عندما تكبر القطرات وتثقل.' },
  collection:    { name: 'التجمع',  icon: '🏞️', lab: 'mission',
                   need: 'تتبّع مسار ماء المطر بعد سقوطه',
                   extra: 'إعادة تتبّع مسار ماء المطر على الخريطة',
                   definition: 'تجمّع ماء المطر في البحيرات والأنهار وباطن الأرض، ثم يعود فيتبخر.' }
};

WC.Learner = function (name) {
  this.name = name || 'أنت';
  this.diagnostic = null;          // 'same' | 'vapor' | 'rain'
  this.c = {};
  var self = this;
  WC.CONCEPT_ORDER.forEach(function (k) {
    self.c[k] = {
      attempts: 0, errors: 0, done: false,
      wrong: [],            // option ids the learner chose wrongly
      activities: [],       // extra activities the engine assigned
      support: 0,           // starting support level (0 = free exploration)
      challenge: null,      // null | 'passed' | 'retry'
      hints: 0
    };
  });
  this.log = [];        // adaptive decisions (response → diagnosis → need → activity → feedback → re-assessment)
  this.timeline = [];   // human-readable journey steps for the learning map
  this.mission = { faults: [], hard: false, changes: 0, hints: 0, success: false, changeLog: [] };
  this.explanation = null;
};

WC.Learner.prototype.addTimeline = function (kind, text) {
  this.timeline.push({ kind: kind, text: text });
};

</script>
<script>
/* adaptive.js — the adaptive engine.
   ---------------------------------------------------------------
   RULES holds every pedagogical decision in one editable place.
   Engine reads the learner model + RULES and returns decisions
   that the screens actually execute (tools shown, options removed,
   challenge offered, mission faults chosen, hints targeted).
   --------------------------------------------------------------- */
window.WC = window.WC || {};

WC.RULES = {
  /* Initial diagnosis → starting support per concept */
  diagnostic: {
    same:  { support: { evaporation: 1 },
             diagnosis: 'لم يربط بعد بين حرارة الشمس وتغيّر الماء',
             decision: 'بدء مختبر الشمس بأداة المقارنة وتوجيه قصير من نُقطة' },
    vapor: { support: {},
             diagnosis: 'تصوّر أولي صحيح عن أثر الحرارة في الماء',
             decision: 'استكشاف حر في مختبر الشمس دون سقالات' },
    rain:  { support: { evaporation: 1, condensation: 1 },
             diagnosis: 'يقفز من الماء إلى المطر دون المرور بالبخار والسحب (تصوّر بديل شائع)',
             decision: 'دعم أولي في التبخر والتكاثف، مع تنبيه إلى المراحل الوسيطة' }
  },

  /* What happens after the n-th wrong answer on the same concept */
  ladder: {
    extraAt: 1,      // first error  → concept-specific extra activity
    scaffoldAt: 2,   // second error → نُقطة scaffold + options reduced
    guidedAt: 3,     // third error  → guided demonstration + two options only
    scaffoldKeep: 3, // options kept after scaffold
    guidedKeep: 2    // options kept in guided mode
  },

  /* Show a short recap of concept B at the start of lab A only if B needed support */
  recapIfErrorsIn: { condensation: ['evaporation'], precipitation: ['condensation'] },

  /* Start lab A with its support tool switched on if any of these concepts needed support */
  supportFromPrior: { precipitation: ['condensation'] },

  /* Mastery on first try → raise the challenge (no re-explanation) */
  challengeOnFirstTry: ['evaporation', 'condensation', 'precipitation'],

  /* Exploration that must happen before the inference question unlocks */
  explore: {
    evaporation: { low: 30, high: 70 },
    condensation: { cold: 70 },
    precipitation: { needRain: true }
  },

  /* Final mission */
  mission: {
    faultsFromErrors: true,        // concepts with errors become the faults to repair
    allFaultsWhenMastered: true,   // no errors at all → all three faults + no stage labels
    hintEveryChanges: { normal: 6, hard: 10 },
    hintIdleSeconds: 30,
    successRain: 0.2, successHold: 3
  }
};

WC.Engine = (function () {
  var R = WC.RULES;
  var C = WC.CONCEPTS;

  function push(L, entry) {
    entry.id = L.log.length + 1;
    entry.result = entry.result || null;
    L.log.push(entry);
    return entry;
  }

  /* ---------- diagnostic ---------- */
  function diagnose(L, optionId, optionText) {
    var rule = R.diagnostic[optionId];
    L.diagnostic = optionId;
    Object.keys(rule.support).forEach(function (k) { L.c[k].support = rule.support[k]; });
    var entry = push(L, {
      concept: 'diagnostic',
      response: 'اختار في التشخيص: «' + optionText + '»',
      diagnosis: rule.diagnosis,
      need: optionId === 'vapor' ? 'استكشاف أعمق دون شرح مسبق' : C.evaporation.need,
      decision: rule.decision,
      feedback: 'لا تُعرض الإجابة الصحيحة؛ التجربة هي التي ستجيب.'
    });
    L.addTimeline(optionId === 'vapor' ? 'ok' : 'sup',
      optionId === 'vapor' ? 'التشخيص: تصوّر صحيح → استكشاف حر' : 'التشخيص: يحتاج إلى دعم في البداية');
    return entry;
  }

  /* ---------- plan of a lab, computed from the learner model ---------- */
  function plan(L, concept) {
    var c = L.c[concept];
    var p = { support: c.support, recap: [], toolFromStart: c.support >= 1, intro: c.support >= 1,
              misconceptionNote: false, hard: false };
    (R.recapIfErrorsIn[concept] || []).forEach(function (k) { if (L.c[k].errors > 0) p.recap.push(k); });
    (R.supportFromPrior[concept] || []).forEach(function (k) {
      if (L.c[k].errors > 0) { p.toolFromStart = true; p.intro = true; p.priorSupport = k; }
    });
    if (L.diagnostic === 'rain' && (concept === 'evaporation' || concept === 'condensation')) p.misconceptionNote = true;
    return p;
  }

  /* ---------- an inference answer on a concept ---------- */
  function answer(L, concept, opt) {
    var c = L.c[concept];
    c.attempts++;
    if (opt.correct) {
      var first = c.errors === 0;
      c.done = true;
      var challenge = first && R.challengeOnFirstTry.indexOf(concept) > -1;
      // re-assessment closes earlier support decisions for this concept
      L.log.forEach(function (e) {
        if (e.concept === concept && !e.result) {
          e.result = 'تحسّن الأداء: استنتج المفهوم بعد ' + (e.action === 'extra' ? 'التجربة الإضافية' : e.action === 'scaffold' ? 'سقالة نُقطة' : 'العرض الموجّه');
        }
      });
      var entry = push(L, {
        concept: concept, action: challenge ? 'challenge' : 'advance',
        response: first ? 'استنتج ' + C[concept].name + ' من المحاولة الأولى' : 'استنتج ' + C[concept].name + (c.errors === 1 ? ' بعد محاولة إضافية' : c.errors === 2 ? ' بعد محاولتين إضافيتين' : ' بعد عدة محاولات'),
        diagnosis: first ? 'فهم متقن للعلاقة' : 'اكتمل الفهم بعد الدعم',
        need: first ? 'تحدٍّ أعلى بدل إعادة الشرح' : 'تثبيت المفهوم في سياق جديد',
        decision: challenge ? 'رفع مستوى التحدي دون إعادة الشرح' : 'الانتقال إلى المرحلة التالية',
        feedback: 'كشف المصطلح العلمي: ' + C[concept].name,
        result: first ? 'متقن من المحاولة الأولى' : 'تحسّن الأداء بعد الدعم'
      });
      L.addTimeline('ok', 'اكتشاف: ' + C[concept].name + (first ? ' (من أول محاولة)' : ''));
      if (challenge) L.addTimeline('ch', 'تحدٍّ أعلى في ' + C[concept].name);
      return { action: entry.action, entry: entry, firstTry: first };
    }

    c.errors++;
    c.wrong.push(opt.id);
    var L2 = R.ladder, action, decision;
    if (c.errors >= L2.guidedAt) {
      action = 'guided';
      decision = 'عرض موجّه: نُقطة تضبط التجربة وتصف ما يحدث، ثم يبقى خياران فقط';
    } else if (c.errors >= L2.scaffoldAt) {
      action = 'scaffold';
      decision = 'تفعيل سقالة من نُقطة وإخفاء الخيارات التي استُبعدت';
    } else {
      action = 'extra';
      decision = 'تقديم ' + C[concept].extra;
      c.activities.push(C[concept].extra);
    }
    var entry2 = push(L, {
      concept: concept, action: action,
      response: 'أخطأ في ' + C[concept].name + ' ' + WC.ar.times(c.errors) + (opt.text ? ' (اختار: «' + opt.text + '»)' : ''),
      diagnosis: opt.why || ('لم يتضح بعد ' + C[concept].need),
      need: C[concept].need,
      decision: decision,
      feedback: opt.fb || ''
    });
    L.addTimeline('sup', (action === 'extra' ? 'تجربة إضافية: ' + C[concept].extra
                       : action === 'scaffold' ? 'سقالة من نُقطة في ' + C[concept].name
                       : 'عرض موجّه في ' + C[concept].name));
    return { action: action, entry: entry2, keep: action === 'scaffold' ? L2.scaffoldKeep : action === 'guided' ? L2.guidedKeep : null };
  }

  function challengeResult(L, concept, passed) {
    L.c[concept].challenge = passed ? 'passed' : 'retry';
    push(L, {
      concept: concept, action: 'challenge-result',
      response: passed ? 'اجتاز التحدي الأعلى في ' + C[concept].name : 'لم يجتز التحدي الأعلى في ' + C[concept].name + ' بعد',
      diagnosis: passed ? 'قدرة على نقل المفهوم إلى موقف جديد' : 'الفهم متقن لكن النقل إلى موقف جديد يحتاج إلى وقت',
      need: passed ? 'لا حاجة إلى دعم' : 'تحدٍّ إضافي لاحقًا',
      decision: passed ? 'متابعة دون تدخل' : 'تسجيل الحاجة في خريطة التعلم دون إيقاف الرحلة',
      feedback: '', result: passed ? 'نجح' : 'مؤجّل'
    });
  }

  /* ---------- mission planning ---------- */
  function planMission(L) {
    var weak = ['evaporation', 'condensation', 'precipitation'].filter(function (k) { return L.c[k].errors > 0; });
    var hard = false;
    if (weak.length === 0 && R.mission.allFaultsWhenMastered) { weak = ['evaporation', 'condensation', 'precipitation']; hard = true; }
    L.mission.faults = weak; L.mission.hard = hard;
    push(L, {
      concept: 'mission', action: 'mission-plan',
      response: hard ? 'أتقن المفاهيم الثلاثة من المحاولة الأولى' : 'احتاج إلى دعم في: ' + weak.map(function (k) { return C[k].name; }).join('، '),
      diagnosis: hard ? 'جاهز لمهمة مركّبة' : 'المفاهيم التي احتاجت دعمًا هي الأولى بالتطبيق',
      need: hard ? 'تحدٍّ مركّب بأقل قدر من المساعدة' : 'تطبيق المفهوم الضعيف في موقف حقيقي',
      decision: hard ? 'تعطيل الحلقات الثلاث وإخفاء أسماء المراحل' : 'تعطيل الحلقة المرتبطة بالمفهوم الذي احتاج دعمًا فقط',
      feedback: '', result: null
    });
    L.addTimeline(hard ? 'ch' : 'sup', hard ? 'المهمة النهائية: ثلاثة أعطال (مستوى أعلى)' : 'المهمة النهائية: أعطال مرتبطة بما احتاج دعمًا');
    return { faults: weak, hard: hard };
  }

  /* Which link of the chain is blocking the rain right now? (diagnosis from simulation state) */
  function missionBlock(s) {
    if (s.evap < 0.45) return 'evaporation';
    if (s.coldF < 0.5) return 'condensation';
    if (s.cloud < 0.45) return 'evaporation';
    if (s.size < 0.6) return 'precipitation';
    return null;
  }

  function missionHint(L, block, tier) {
    L.mission.hints++;
    if (block) L.c[block].hints++;
    var e = push(L, {
      concept: 'mission', action: 'hint',
      response: 'غيّر المتغيرات ' + WC.ar.times(Math.max(1, L.mission.changes)) + ' ولم يعد المطر بعد',
      diagnosis: 'الحلقة المتوقفة في الدورة: ' + (block ? C[block].name : 'غير محددة'),
      need: block ? C[block].need : '',
      decision: 'تلميح ' + (tier === 1 ? 'عام (سؤال)' : 'موجّه') + ' من نُقطة عن ' + (block ? C[block].name : 'الدورة'),
      feedback: '', result: null
    });
    L.addTimeline('sup', 'تلميح موجّه في المهمة: ' + (block ? C[block].name : ''));
    return e;
  }

  function missionSuccess(L) {
    L.mission.success = true;
    L.log.forEach(function (e) { if (e.concept === 'mission' && e.action === 'hint' && !e.result) e.result = 'عاد المطر بعد التلميح'; });
    L.addTimeline('ok', 'أعاد تشغيل دورة المياه');
  }

  /* ---------- learning-map status: a state, not a score ---------- */
  function status(L, concept) {
    var c = L.c[concept];
    if (!c.done && c.attempts === 0) return { key: 'pending', shape: '◌', label: 'لم يبدأ بعد' };
    if (!c.done || c.errors >= R.ladder.guidedAt) return { key: 'needs', shape: '○', emoji: '🟠', label: 'يحتاج إلى تحدٍ إضافي' };
    if (c.errors === 0) return { key: 'mastered', shape: '●', emoji: '🟢', label: 'متقن' };
    if (c.errors === 1) return { key: 'extra', shape: '◐', emoji: '🟡', label: 'أتقن بعد تجربة إضافية' };
    return { key: 'guided', shape: '◐', emoji: '🟡', label: 'أتقن بعد دعم من نُقطة' };
  }

  return { diagnose: diagnose, plan: plan, answer: answer, challengeResult: challengeResult,
           planMission: planMission, missionBlock: missionBlock, missionHint: missionHint,
           missionSuccess: missionSuccess, status: status };
})();

</script>
<script>
/* audio.js — optional voice (UDL: more than one way to receive instructions).
   Uses the browser's built-in speech synthesis, so it works offline when an
   Arabic voice is installed. Off by default; the learner switches it on. */
window.WC = window.WC || {};

WC.Audio = (function () {
  var enabled = false, voice = null, ctx = null;
  var synth = window.speechSynthesis;

  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    voice = vs.find(function (v) { return /^ar/i.test(v.lang); }) || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

  function clean(t) {
    return String(t).replace(/<[^>]+>/g, ' ')
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
      .replace(/[«»]/g, '').replace(/\s+/g, ' ').trim();
  }

  return {
    get enabled() { return enabled; },
    supported: !!synth,
    toggle: function () { enabled = !enabled; if (!enabled) this.stop(); return enabled; },
    speak: function (text, force) {
      if ((!enabled && !force) || !synth) return;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(clean(text));
      u.lang = 'ar-SA'; u.rate = 0.92; if (voice) u.voice = voice;
      synth.speak(u);
    },
    stop: function () { if (synth) synth.cancel(); },
    /** soft two-note chime on a discovery (only when sound is on) */
    chime: function () {
      if (!enabled) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        [659, 988].forEach(function (f, i) {
          var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.14;
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
          o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.65);
        });
      } catch (e) { /* audio is optional */ }
    }
  };
})();

<script>
/* nuqta.js — «نُقطة», the learning companion.
   She appears ONLY when she has a pedagogical job:
   a question, a hint, a scaffold, encouragement, or explaining why the path changed.
   She never gives the answer directly. */
window.WC = window.WC || {};

WC.Nuqta = (function () {
  var root, timer;
  var KINDS = {
    question: 'سؤال للتفكير',
    hint: 'تلميح',
    scaffold: 'سقالة: لنجرّب بطريقة أخرى',
    cheer: 'تشجيع',
    why: 'لماذا تغيّر مسارك؟'
  };
  var AVATAR =
    '<svg class="avatar" viewBox="0 0 64 76" aria-hidden="true">' +
    '<defs><linearGradient id="nq-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8BD0F2"/><stop offset="1" stop-color="#1D78AF"/></linearGradient></defs>' +
    '<path d="M32 3C32 3 7 33 7 50a25 25 0 0 0 50 0C57 33 32 3 32 3Z" fill="url(#nq-g)"/>' +
    '<ellipse cx="21" cy="39" rx="4.5" ry="8" fill="#fff" opacity=".35" transform="rotate(18 21 39)"/>' +
    '<g class="nq-eyes"><ellipse cx="24" cy="51" rx="3.2" ry="4.3" fill="#0F2236"/><ellipse cx="40" cy="51" rx="3.2" ry="4.3" fill="#0F2236"/>' +
    '<circle cx="25" cy="49.5" r="1" fill="#fff"/><circle cx="41" cy="49.5" r="1" fill="#fff"/></g>' +
    '<path d="M27.5 60q4.5 3.6 9 0" stroke="#0F2236" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';

  function ensure() {
    if (root) return root;
    root = document.createElement('aside');
    root.className = 'nuqta'; root.hidden = true;
    root.setAttribute('aria-live', 'polite');
    root.setAttribute('aria-label', 'نُقطة');
    document.body.appendChild(root);
    return root;
  }

  function say(o) {
    ensure();
    clearTimeout(timer);
    root.className = 'nuqta ' + (o.kind || 'hint');
    root.innerHTML = AVATAR +
      '<div class="bubble" role="status">' +
      '<div class="kind"><span>💧 نُقطة · ' + (KINDS[o.kind] || KINDS.hint) + '</span>' +
      '<button class="x" type="button" aria-label="إخفاء رسالة نُقطة">×</button></div>' +
      '<p class="msg">' + o.text + '</p>' +
      (o.actions && o.actions.length ? '<div class="acts"></div>' : '') +
      '</div>';
    root.hidden = false;
    root.querySelector('.x').onclick = hide;
    if (o.actions) {
      var acts = root.querySelector('.acts');
      o.actions.forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn small' + (a.ghost ? ' ghost' : '');
        b.textContent = a.label;
        b.onclick = function () { if (!a.keep) hide(); a.onClick && a.onClick(); };
        acts.appendChild(b);
      });
    }
    WC.Audio.speak(o.text);
    if (o.timeout) timer = setTimeout(hide, o.timeout);
  }

  function hide() { if (root) { root.hidden = true; root.innerHTML = ''; } clearTimeout(timer); }

  return { say: say, hide: hide, AVATAR: AVATAR };
})();

<script>
/* ui.js — small reusable UI building blocks shared by all screens. */
window.WC = window.WC || {};

WC.UI = (function () {
  var ar = WC.ar;

  function h(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* Accessible slider with a live, Arabic-numeral output and word labels at both ends. */
  function slider(o) {
    var id = 'sl-' + o.id;
    var node = h(
      '<div class="control ' + (o.cls || '') + '">' +
      '<div class="head"><label for="' + id + '">' + o.label + '</label><output for="' + id + '" id="' + id + '-o"></output></div>' +
      '<input type="range" id="' + id + '" min="' + (o.min || 0) + '" max="' + (o.max || 100) + '" step="' + (o.step || 1) + '" value="' + o.value + '" aria-describedby="' + id + '-e">' +
      '<div class="ends" id="' + id + '-e"><span>' + o.ends[0] + '</span><span>' + o.ends[1] + '</span></div>' +
      '</div>');
    var input = node.querySelector('input'), out = node.querySelector('output');
    var fmt = o.format || function (v) { return ar.pct(v); };
    function paint() {
      var v = +input.value, f = (v - input.min) / (input.max - input.min) * 100;
      input.style.setProperty('--fill', f + '%');
      out.textContent = fmt(v);
      input.setAttribute('aria-valuetext', (o.valueText || fmt)(v));
    }
    input.addEventListener('input', function () { paint(); o.onInput && o.onInput(+input.value); });
    input.addEventListener('change', function () { o.onChange && o.onChange(+input.value); });
    paint();
    return {
      node: node, input: input,
      get value() { return +input.value; },
      set: function (v, fire) { input.value = v; paint(); if (fire && o.onInput) o.onInput(+input.value); },
      disable: function (d) { input.disabled = d; node.classList.toggle('locked', d); }
    };
  }

  /* Inference question. Wrong answers are never shown as "❌ wrong":
     tried options become dashed and the screen's adaptive logic decides what happens next. */
  function Question(container, o) {
    var self = this;
    this.o = o;
    this.node = h('<div class="question"><h3 id="q-' + o.id + '">' + o.prompt + '</h3>' +
      '<div class="options" role="group" aria-labelledby="q-' + o.id + '"></div></div>');
    var list = this.node.querySelector('.options');
    var keys = ['أ', 'ب', 'ج', 'د', 'هـ'];
    this.btns = {};
    o.options.forEach(function (opt, i) {
      var b = h('<button type="button" class="opt" data-id="' + opt.id + '"><span class="k" aria-hidden="true">' + keys[i] + '</span>' +
        (opt.ico ? '<span class="ico" aria-hidden="true">' + opt.ico + '</span>' : '') + '<span>' + opt.text + '</span></button>');
      b.addEventListener('click', function () {
        if (self.locked || b.classList.contains('tried')) return;
        o.onAnswer && o.onAnswer(opt, b);
      });
      list.appendChild(b);
      self.btns[opt.id] = b;
    });
    container.appendChild(this.node);
  }
  Question.prototype.markTried = function (id) { var b = this.btns[id]; b.classList.add('tried'); b.setAttribute('aria-disabled', 'true'); b.querySelector('.k').textContent = '↺'; };
  Question.prototype.markRight = function (id) { this.btns[id].classList.add('right'); this.btns[id].querySelector('.k').textContent = '✓'; this.lock(); };
  Question.prototype.lock = function () { this.locked = true; Object.values(this.btns).forEach(function (b) { b.disabled = true; }); };
  Question.prototype.unlock = function () { this.locked = false; Object.values(this.btns).forEach(function (b) { b.disabled = false; }); };
  /* keep the correct option + (n-1) distractors: untried ones first, then (re-enabled) tried ones */
  Question.prototype.reduceTo = function (n, allowTried) {
    var self = this, slots = n - 1;
    var wrong = this.o.options.filter(function (o) { return !o.correct; });
    var order = wrong.filter(function (o) { return !self.btns[o.id].classList.contains('tried'); })
      .concat(allowTried ? wrong.filter(function (o) { return self.btns[o.id].classList.contains('tried'); }) : []);
    wrong.forEach(function (o) { if (order.indexOf(o) === -1) self.btns[o.id].hidden = true; });
    order.forEach(function (opt, i) {
      var b = self.btns[opt.id];
      if (i < slots) {
        b.hidden = false;
        if (b.classList.contains('tried')) { b.classList.remove('tried'); b.removeAttribute('aria-disabled'); b.querySelector('.k').textContent = '•'; }
      } else b.hidden = true;
    });
  };
  Question.prototype.focusFirst = function () { var b = this.node.querySelector('.opt:not([hidden]):not(.tried)'); if (b) b.focus(); };

  function feedback(node, kind, title, text) {
    node.className = 'feedback show' + (kind === 'good' ? ' good' : '');
    node.innerHTML = '<b>' + title + '</b><span>' + text + '</span>';
    node.setAttribute('role', 'status');
  }

  function discovery(concept) {
    var c = WC.CONCEPTS[concept];
    WC.Audio.chime();
    return h('<div class="discovery" role="status"><div class="badge" aria-hidden="true">' + c.icon + '</div>' +
      '<div><small>اكتشاف جديد</small><strong>' + c.name + '</strong></div><p>' + c.definition + '</p></div>');
  }

  function pathNote(text, ico) {
    return h('<div class="path-note"><span class="ico" aria-hidden="true">' + (ico || '🧭') + '</span><span>' + text + '</span></div>');
  }

  function meter(label) {
    var n = h('<div class="meter"><span>' + label + '</span><span class="bar"><i></i></span><span class="word">—</span></div>');
    return { node: n, set: function (v, word) { n.querySelector('i').style.width = Math.round(v * 100) + '%'; n.querySelector('.word').textContent = word; } };
  }

  function level3(v, words) { return v < 0.34 ? words[0] : v < 0.67 ? words[1] : words[2]; }

  return { h: h, esc: esc, slider: slider, Question: Question, feedback: feedback, discovery: discovery,
           pathNote: pathNote, meter: meter, level3: level3 };
})();

</script>

<script>
/* personas.js — sample learner data.
   Each persona is a scripted sequence of RESPONSES (not results).
   The responses are run through the same adaptive engine the real learner uses,
   so the different journeys you see are produced by the engine itself.
   1 = correct, 0 = a wrong option (the first untried distractor is used). */
window.WC = window.WC || {};

WC.PERSONAS = [
  { id: 'sara', name: 'سارة', blurb: 'توقّع صحيح، واستنتاجات من المحاولة الأولى',
    diag: 'vapor',
    answers: { evaporation: [1], condensation: [1], precipitation: [1], collection: [1] },
    challenges: { evaporation: true, condensation: true, precipitation: true },
    missionHints: 0, explanation: 'رفعتُ حرارة الشمس فزاد البخار، ثم برّدت الهواء فتكوّنت سحابة، وكبّرت القطرات فهطل المطر.' },
  { id: 'yousef', name: 'يوسف', blurb: 'أتقن التبخر، واحتاج إلى دعم في التكاثف',
    diag: 'vapor',
    answers: { evaporation: [1], condensation: [0, 0, 1], precipitation: [1], collection: [1] },
    challenges: { evaporation: true, precipitation: false },
    missionHints: 1, explanation: '' },
  { id: 'layan', name: 'ليان', blurb: 'بدأت بتصوّر بديل: «الماء يصير مطرًا مباشرة»',
    diag: 'rain',
    answers: { evaporation: [0, 1], condensation: [0, 1], precipitation: [1], collection: [0, 1] },
    challenges: { precipitation: true },
    missionHints: 2, explanation: '' }
];

/* Run a persona's responses through WC.Engine and return the resulting learner model */
WC.simulatePersona = function (p) {
  var E = WC.Engine, K = WC.CONTENT, L = new WC.Learner(p.name);
  var dOpt = K.diagnostic.options.find(function (o) { return o.id === p.diag; });
  E.diagnose(L, p.diag, dOpt.text);
  function run(concept) {
    var wrong = K[concept].options.filter(function (o) { return !o.correct; }), wi = 0;
    var right = K[concept].options.find(function (o) { return o.correct; });
    p.answers[concept].forEach(function (a) {
      var res = E.answer(L, concept, a ? right : wrong[wi++ % wrong.length]);
      if (a && res.action === 'challenge' && p.challenges[concept] !== undefined) E.challengeResult(L, concept, p.challenges[concept]);
    });
  }

<script>
/* scene.js — canvas base class + shared painters (sky, sun, lake, hills, cloud).
   Simulations are deliberately simplified for learning: they show
   relationships (more heat → more vapour), not exact physics. */
window.WC = window.WC || {};

WC.Sim = class {
  constructor(canvas) {
    this.c = canvas; this.ctx = canvas.getContext('2d');
    this.w = 1; this.h = 1; this.t = 0; this.raf = 0;
    this.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.speed = this.reduced ? 0.55 : 1;
    var self = this;
    this.ro = new ResizeObserver(function () { self.resize(); });
    this.ro.observe(canvas);
    this.resize();
  }
  resize() {
    var r = this.c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (r.width < 2 || r.height < 2) return;
    this.w = r.width; this.h = r.height;
    this.c.width = Math.round(r.width * dpr); this.c.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (this.onResize) this.onResize();
  }
  start() {
    var self = this, last = performance.now();
    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000) * self.speed; last = now;
      self.t += dt;
      self.update(dt); self.draw();
      self.raf = requestAnimationFrame(loop);
    }
    this.raf = requestAnimationFrame(loop);
    return this;
  }
  stop() { cancelAnimationFrame(this.raf); this.ro.disconnect(); }
  update() {} draw() {}
};

WC.Paint = (function () {
  /* accepts '#rrggbb' or 'rgb(r,g,b)' so mixes can be nested */
  function hex(c) {
    if (c.charAt(0) === 'r') return c.match(/\d+/g).slice(0, 3).map(Number);
    c = c.replace('#', ''); return [parseInt(c.substr(0, 2), 16), parseInt(c.substr(2, 2), 16), parseInt(c.substr(4, 2), 16)];

    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')';

    warm = warm || 0; cold = cold || 0;
    var top = mix(mix('#8EC2E4', '#79AEDC', warm * 0.4), '#5E8DBE', cold * 0.6);
    var bot = mix(mix('#EAF5FB', '#FCE6C4', warm), '#D9E6F2', cold * 0.7);
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  function sun(ctx, x, y, r, k, t) {
    var glowR = r * (1.8 + k * 2.6);
    var g = ctx.createRadialGradient(x, y, r * 0.6, x, y, glowR);
    g.addColorStop(0, 'rgba(255,214,120,' + (0.35 + k * 0.45) + ')');
    g.addColorStop(1, 'rgba(255,214,120,0)');

    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.08);

      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 1.25, Math.sin(a) * r * 1.25);

    }

    for (var x = 0; x <= w; x += 10) ctx.lineTo(x, baseY - 26 - Math.sin(x / w * 5.2 + 1) * 18 - Math.sin(x / w * 11) * 6);

  var BLOBS = [[-1.0, 0.12, 0.52], [-0.5, -0.22, 0.68], [0.15, -0.38, 0.8], [0.75, -0.1, 0.62], [1.18, 0.14, 0.46], [0.1, 0.16, 0.72], [-0.45, 0.2, 0.55], [0.65, 0.22, 0.55]];

  function drop(ctx, x, y, r, color) {
    ctx.fillStyle = color || '#3A8FD0';

  /* water vapour: a soft, ring-less puff (reads as steam, not bubbles) */
  function wisp(ctx, x, y, r, a) {

    g.addColorStop(0.45, 'rgba(214,232,245,' + (0.4 * a) + ')');
    g.addColorStop(1, 'rgba(214,232,245,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
  }

  return { mix: mix, clamp: clamp, smooth: smooth, sky: sky, sun: sun, hills: hills, lake: lake, cloud: cloud, drop: drop, wisp: wisp };
})();

/* ---------- Gate: slow cinematic landscape ---------- */
WC.GateScene = class extends WC.Sim {
  constructor(c) {

<script>
/* evaporation.js — Sun lab.
   Control: heat 0..100.  Visible relationships:
   heat ↑ → water particles move faster → more vapour rises → faster evaporation. */
window.WC = window.WC || {};

WC.EvapSim = class extends WC.Sim {
  constructor(c) {
    super(c);
    this.heat = 20; this.k = 0.2;
    this.mol = []; this.vap = []; this.acc = 0; this.emitted = 0;
    this.ready = true; this.onResize();
  }
  onResize() {
    if (!this.ready) return;
    this.top = this.h * 0.64;
    if (!this.mol.length) {
      for (var i = 0; i < 42; i++) this.mol.push({ x: Math.random() * this.w, y: this.top + 14 + Math.random() * (this.h - this.top - 22), vx: 0, vy: 0 });
    }
  }
  set(v) { this.heat = v; }
  update(dt) {
    var P = WC.Paint, w = this.w, h = this.h, top = this.top;
    this.k += (this.heat / 100 - this.k) * Math.min(1, dt * 3);
    var k = this.k, sp = 6 + k * 110;
    this.mol.forEach(function (m) {
      m.vx += (Math.random() - 0.5) * sp * 9 * dt; m.vy += (Math.random() - 0.5) * sp * 9 * dt;
      var v = Math.hypot(m.vx, m.vy); if (v > sp) { m.vx *= sp / v; m.vy *= sp / v; }
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x < 4 || m.x > w - 4) { m.vx *= -1; m.x = P.clamp(m.x, 4, w - 4); }
      if (m.y < top + 8 || m.y > h - 6) { m.vy *= -1; m.y = P.clamp(m.y, top + 8, h - 6); }
    });
    var rate = 0.3 + Math.pow(k, 1.6) * 24;
    this.acc += rate * dt;
    while (this.acc >= 1) {
      this.acc--; this.emitted++;
      this.vap.push({ x: Math.random() * w, y: top, vy: -(22 + k * 46 + Math.random() * 10), r: 2.4 + Math.random() * 2, wob: Math.random() * 6.28 });
    }
    var t = this.t;
    this.vap = this.vap.filter(function (p) {
      p.y += p.vy * dt; p.x += Math.sin(t * 1.6 + p.wob) * 14 * dt; p.r += dt * 2.4;
      p.a = P.clamp((p.y - h * 0.06) / (top * 0.55));
      return p.y > h * 0.05;
    });
  }
  draw() {
    var ctx = this.ctx, w = this.w, h = this.h, P = WC.Paint, k = this.k, t = this.t, top = this.top;
    P.sky(ctx, w, h, k, 0);
    P.sun(ctx, w * 0.84, h * 0.2, Math.min(w, h) * (0.07 + k * 0.025), k, t);
    P.hills(ctx, w, h, top + 2);
    P.lake(ctx, 0, w, top, h, t, 1.5 + k * 2);
    // heat shimmer on the surface
    ctx.fillStyle = 'rgba(255,190,90,' + (k * 0.35) + ')'; ctx.fillRect(0, top - 1, w, 5);
    ctx.lineCap = 'round';
    this.mol.forEach(function (m) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.15 + k * 0.35) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 0.06, m.y - m.vy * 0.06); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(m.x, m.y, 3.2, 0, Math.PI * 2); ctx.fill();
    });
    this.vap.forEach(function (p) { P.wisp(ctx, p.x, p.y, p.r, p.a); });
  }
  /* words for the meters — so understanding never depends on motion alone */
  read() {
    var k = this.k;
    return {
      motion: k, motionWord: WC.UI.level3(k, ['بطيئة', 'متوسطة', 'سريعة']),
      vapor: Math.min(1, Math.pow(k, 1.3) * 1.05), vaporWord: WC.UI.level3(Math.pow(k, 1.3), ['قليل', 'متوسط', 'كثير'])
    };
  }
  /* compare tool: count vapour produced in a fixed window */
  measure(sec) {
    var self = this, start = this.emitted;
    return new Promise(function (res) { setTimeout(function () { res(self.emitted - start); }, sec * 1000 / self.speed); });
  }
};

<script>
/* condensation.js — Clouds lab.
   Control: air coldness 0 (warm) .. 100 (cold).
   Rising vapour → (cold air) → tiny droplets → gather into a cloud.
   Warm air makes droplets turn back into vapour. */
window.WC = window.WC || {};

WC.CloudSim = class extends WC.Sim {
  constructor(c) {
    super(c);
    this.cold = 10; this.k = 0.1; this.p = []; this.acc = 0; this.ready = true;
  }
  set(v) { this.cold = v; }
  temp() { return 30 - this.cold * 0.32; }
  update(dt) {
    var P = WC.Paint, w = this.w, h = this.h, t = this.t;
    this.k += (this.cold / 100 - this.k) * Math.min(1, dt * 2.5);
    var f = P.smooth(0.35, 0.85, this.k);
    var cx = w * 0.5, cy = h * 0.25, rx = w * 0.26, ry = h * 0.085;
    this.acc += 15 * dt;
    while (this.acc >= 1 && this.p.length < 280) {
      this.acc--;
      this.p.push({ s: 'v', x: w * 0.12 + Math.random() * w * 0.76, y: h * 0.9, r: 2.4 + Math.random() * 1.6, wob: Math.random() * 6.28 });
    }
    if (this.acc > 2) this.acc = 0;
    this.p = this.p.filter(function (q) {
      if (q.s === 'v') {
        q.y -= (30 + Math.random() * 6) * dt; q.x += Math.sin(t * 1.5 + q.wob) * 12 * dt; q.r += dt * 0.8;
        if (q.y < h * 0.58 && Math.random() < f * 1.9 * dt) {
          q.s = 'd'; q.r = 2.2;
          var a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random());
          q.tx = cx + Math.cos(a) * rx * rr; q.ty = cy + Math.sin(a) * ry * rr;
        }
        return q.y > h * 0.06;
      }
      if (q.s === 'd') {
        q.x += (q.tx - q.x) * 1.3 * dt; q.y += (q.ty - q.y) * 1.3 * dt;
        if (Math.abs(q.tx - q.x) + Math.abs(q.ty - q.y) < 8) q.s = 'c';
      } else {
        q.x = q.tx + Math.sin(t * 2 + q.wob) * 2; q.y = q.ty + Math.cos(t * 1.7 + q.wob) * 2;
      }
      if (Math.random() < (1 - f) * 0.9 * dt) { q.s = 'v'; q.r = 3; }
      return true;
    });
    this.counts = { v: 0, d: 0, c: 0 };
    var cnt = this.counts; this.p.forEach(function (q) { cnt[q.s]++; });
  }
  stage() {
    var n = this.counts || { v: 0, d: 0, c: 0 };
    if (n.c > 70) return 'cloud';
    if (n.d + n.c > 12) return 'drops';
    return 'vapor';
  }
  draw() {
    var ctx = this.ctx, w = this.w, h = this.h, P = WC.Paint, k = this.k, t = this.t;
    P.sky(ctx, w, h, (1 - k) * 0.5, k);
    // the air gets colder higher up: a soft cold band that strengthens with the control
    var g = ctx.createLinearGradient(0, 0, 0, h * 0.6);
    g.addColorStop(0, 'rgba(120,170,225,' + (k * 0.45) + ')'); g.addColorStop(1, 'rgba(120,170,225,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h * 0.6);
    P.hills(ctx, w, h, h * 0.92, '#BCD6C6', '#A4C8B0');
    P.lake(ctx, w * 0.08, w * 0.92, h * 0.9, h, t, 1.5);
    var n = this.counts || { c: 0 };
    var mass = Math.min(1, n.c / 120);
    P.cloud(ctx, w * 0.5, h * 0.25, Math.min(w, h) * (0.1 + mass * 0.07), 0.1 + mass * 0.2, Math.min(0.95, n.c / 90));
    this.p.forEach(function (q) {
      if (q.s === 'v') P.wisp(ctx, q.x, q.y, q.r, P.clamp((q.y - h * 0.06) / (h * 0.3)) * 0.9);
      else if (q.s === 'd') P.drop(ctx, q.x, q.y, q.r, '#2F86C8');
      else { ctx.fillStyle = 'rgba(47,134,200,' + (0.55 - mass * 0.35) + ')'; ctx.beginPath(); ctx.arc(q.x, q.y, 1.9, 0, Math.PI * 2); ctx.fill(); }
    });
  }
};

<script>
/* precipitation.js — Rain lab.
   Controls: vapour amount (0..100), droplet size (0..100).
   Rule (kept simple and visible): rain starts when the cloud holds enough water
   AND its droplets are big/heavy enough to beat the rising air. */
window.WC = window.WC || {};

WC.RAIN_RULE = { vapor: 50, size: 60, heavy: 0.85 };

WC.RainSim = class extends WC.Sim {
  constructor(c) {
    super(c);
    this.vapor = 25; this.size = 20; this.v = 0.25; this.s = 0.2;
    this.inner = Array.from({ length: 80 }, function () { var a = Math.random() * 6.28, r = Math.sqrt(Math.random()); return { a: a, r: r, wob: Math.random() * 6.28 }; });
    this.rain = []; this.splash = []; this.acc = 0; this.puddle = 0; this.ready = true;
  }
  set(name, val) { this[name] = val; }
  state() {
    var R = WC.RAIN_RULE, raining = this.vapor >= R.vapor && this.size >= R.size;
    var I = raining ? WC.Paint.clamp(((this.size - R.size) / (100 - R.size)) * 0.5 + ((this.vapor - R.vapor) / (100 - R.vapor)) * 0.5 + 0.2) : 0;
    return { raining: raining, intensity: I, vapor: this.vapor, size: this.size,
             word: !raining ? 'لا مطر' : I < 0.45 ? 'مطر خفيف' : I < WC.RAIN_RULE.heavy ? 'مطر متوسط' : 'مطر غزير' };
  }
  update(dt) {
    var w = this.w, h = this.h;
    this.v += (this.vapor / 100 - this.v) * Math.min(1, dt * 3);
    this.s += (this.size / 100 - this.s) * Math.min(1, dt * 3);
    var st = this.state(), cx = w * 0.5, cy = h * 0.28, sc = Math.min(w, h) * (0.12 + this.v * 0.06);
    this.acc += st.intensity * 150 * dt;
    while (this.acc >= 1) {
      this.acc--;
      this.rain.push({ x: cx + (Math.random() - 0.5) * sc * 2.4, y: cy + sc * 0.45, vy: 260 + this.size * 2.4, len: 8 + this.size * 0.12 });
    }
    var ground = h * 0.84, self = this;
    this.rain = this.rain.filter(function (r) {
      r.y += r.vy * dt;
      if (r.y > ground) { self.splash.push({ x: r.x, y: ground + Math.random() * 6, a: 1 }); return false; }
      return true;
    });
    this.splash = this.splash.filter(function (s) { s.a -= dt * 2.4; return s.a > 0; });
    this.puddle = Math.min(1, Math.max(0, this.puddle + (st.intensity * 0.06 - 0.01) * dt));
  }
  draw() {
    var ctx = this.ctx, w = this.w, h = this.h, P = WC.Paint, t = this.t;
    var st = this.state();
    P.sky(ctx, w, h, 0, 0.25 + this.v * 0.45);
    var ground = h * 0.84;
    ctx.fillStyle = '#9BC3A4'; ctx.fillRect(0, ground, w, h - ground);
    ctx.fillStyle = '#86B391'; ctx.fillRect(0, ground, w, 6);
    if (this.puddle > 0.01) {
      ctx.fillStyle = 'rgba(43,134,186,.75)';
      ctx.beginPath(); ctx.ellipse(w * 0.5, ground + 16, w * (0.08 + this.puddle * 0.3), 6 + this.puddle * 8, 0, 0, Math.PI * 2); ctx.fill();
    }
    var cx = w * 0.5, cy = h * 0.28, sc = Math.min(w, h) * (0.12 + this.v * 0.06);
    P.cloud(ctx, cx, cy, sc, 0.08 + this.v * 0.6, 0.55 + this.v * 0.4);
    // droplets inside the cloud: more vapour → more droplets, size control → bigger droplets
    var n = Math.round(12 + this.v * 64), rad = 1.4 + this.s * 5;
    for (var i = 0; i < n; i++) {
      var d = this.inner[i], jig = st.raining ? 0 : Math.sin(t * 2.4 + d.wob) * 3;
      var x = cx + Math.cos(d.a) * d.r * sc * 1.25, y = cy + Math.sin(d.a) * d.r * sc * 0.35 + jig;
      P.drop(ctx, x, y, rad * 0.8, 'rgba(35,110,170,.75)');
    }
    ctx.strokeStyle = 'rgba(40,110,170,.7)'; ctx.lineCap = 'round'; ctx.lineWidth = 1.6 + this.s * 1.4;
    this.rain.forEach(function (r) { ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 2, r.y - r.len); ctx.stroke(); });
    this.splash.forEach(function (s) {
      ctx.strokeStyle = 'rgba(40,110,170,' + s.a * 0.6 + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, (1 - s.a) * 8 + 2, (1 - s.a) * 2 + 1, 0, 0, Math.PI * 2); ctx.stroke();
    });
  }
};

</script>
<script>
/* cycle.js — the full water cycle for the rescue mission.
   Four controls feed a causal chain with deliberate lag, so a change
   is seen travelling link by link:  ☀️ → 💧 → 💨 → ☁️ → 🌧️ → 🏞️  */
window.WC = window.WC || {};

WC.CYCLE_MODEL = {
  good:  { sun: 75, air: 75, vapor: 65, size: 75 },   // values that keep the cycle alive
  fault: { sun: 15, air: 12, size: 20 },              // values that break one link each
  /* stage targets (all 0..1) */
  evap:  function (c) { return c.sun / 100; },
  vapor: function (evap, c) { return evap * (0.35 + 0.65 * c.vapor / 100); },  // vapour comes only from evaporation
  coldF: function (c) { return WC.Paint.smooth(0.35, 0.8, c.air / 100); },
  cloud: function (vapor, coldF) { return vapor * coldF; },
  rain:  function (cloud, c) { var P = WC.Paint; return P.clamp((cloud - 0.4) / 0.35) * P.clamp((c.size / 100 - 0.5) / 0.35); }
};

WC.CycleSim = class extends WC.Sim {
  constructor(c, ctrl) {
    super(c);
    var M = WC.CYCLE_MODEL;
    this.ctrl = Object.assign({}, ctrl);
    this.s = { heat: 0, evap: 0, vapor: 0, coldF: 0, cloud: 0, rain: 0, lake: 0.22, size: 0 };
    // start the smoothed stages at their current equilibrium (so the broken state is visible at once)
    var e = M.evap(this.ctrl), v = M.vapor(e, this.ctrl), cf = M.coldF(this.ctrl), cl = M.cloud(v, cf);
    Object.assign(this.s, { heat: e, evap: e, vapor: v, coldF: cf, cloud: cl, rain: M.rain(cl, this.ctrl), size: this.ctrl.size / 100 });
    this.vp = []; this.rd = []; this.acc = 0; this.racc = 0; this.ready = true;
  }
  set(name, v) { this.ctrl[name] = v; }
  update(dt) {
    var M = WC.CYCLE_MODEL, s = this.s, c = this.ctrl, w = this.w, h = this.h, P = WC.Paint;
    function ease(key, target, rate) { s[key] += (target - s[key]) * Math.min(1, dt * rate); }
    ease('heat', c.sun / 100, 3);
    ease('evap', M.evap(c), 1.6);
    ease('vapor', M.vapor(s.evap, c), 1.1);
    ease('coldF', M.coldF(c), 2);
    ease('cloud', M.cloud(s.vapor, s.coldF), 0.9);
    ease('size', c.size / 100, 2);
    ease('rain', M.rain(s.cloud, c), 1.2);
    s.lake = P.clamp(s.lake + (s.rain * 0.08 - 0.004 - s.evap * 0.003) * dt, 0.08, 1);
    // particles
    var lx0 = w * 0.52, lx1 = w * 0.98, ly = this.lakeTop();
    this.acc += s.evap * 22 * dt;
    while (this.acc >= 1) { this.acc--; this.vp.push({ x: lx0 + Math.random() * (lx1 - lx0), y: ly, r: 2 + Math.random() * 1.5, wob: Math.random() * 6.28 }); }
    var t = this.t, cx = w * 0.34, cy = h * 0.2;
    this.vp = this.vp.filter(function (p) {
      p.y -= (24 + s.heat * 30) * dt;
      p.x += ((cx - p.x) * 0.25 + Math.sin(t * 1.5 + p.wob) * 10) * dt;
      p.r += dt * 1.2;
      p.a = P.clamp((p.y - h * 0.14) / (h * 0.3));
      return p.y > h * 0.14;
    });
    this.racc += s.rain * 120 * dt;
    var sc = this.cloudScale();
    while (this.racc >= 1) { this.racc--; this.rd.push({ x: cx + (Math.random() - 0.5) * sc * 2.3, y: cy + sc * 0.4, vy: 280 + c.size * 2 }); }
    var self = this;
    this.rd = this.rd.filter(function (r) { r.y += r.vy * dt; return r.y < self.groundY(r.x); });
  }
  lakeTop() { return this.h * (0.9 - this.s.lake * 0.12); }
  groundY(x) { return this.h * 0.62 + (x / this.w) * this.h * 0.2; }
  cloudScale() { return Math.min(this.w, this.h) * (0.07 + this.s.cloud * 0.1); }
  draw() {
    var ctx = this.ctx, w = this.w, h = this.h, P = WC.Paint, s = this.s, t = this.t;
    P.sky(ctx, w, h, s.heat * 0.8, s.coldF * 0.5);
    P.sun(ctx, w * 0.86, h * 0.15, Math.min(w, h) * (0.055 + s.heat * 0.02), s.heat, t);
    // land: dry when the lake is low, green when the cycle is restored
    var green = P.clamp((s.lake - 0.2) / 0.5);
    ctx.fillStyle = P.mix('#C8B184', '#8EBE7E', green);
    ctx.beginPath(); ctx.moveTo(0, h);
    ctx.lineTo(0, h * 0.5);
    ctx.quadraticCurveTo(w * 0.12, h * 0.36, w * 0.24, h * 0.55);
    ctx.lineTo(w * 0.5, h * 0.78); ctx.lineTo(w, h * 0.86); ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
    // river from the mountain to the lake (flows when rain feeds it)
    var flow = P.clamp(s.rain * 1.6 + (s.lake - 0.3));
    ctx.strokeStyle = 'rgba(43,134,186,' + (0.25 + flow * 0.7) + ')'; ctx.lineWidth = 3 + flow * 5; ctx.lineCap = 'round';
    ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 40 * flow;
    ctx.beginPath(); ctx.moveTo(w * 0.14, h * 0.5); ctx.quadraticCurveTo(w * 0.3, h * 0.74, w * 0.56, this.lakeTop() + 4); ctx.stroke();
    ctx.setLineDash([]);
    // lake
    P.lake(ctx, w * 0.52, w, this.lakeTop(), h, t, 1.5);
    ctx.fillStyle = 'rgba(120,90,50,.18)'; ctx.fillRect(w * 0.52, h * 0.9, w * 0.48, 3); // old shoreline mark
    this.vp.forEach(function (p) { P.wisp(ctx, p.x, p.y, p.r, p.a * 0.9); });
    P.cloud(ctx, w * 0.34, h * 0.2, this.cloudScale(), 0.1 + P.clamp(s.size) * s.cloud * 0.7, P.clamp(s.cloud * 1.6));
    ctx.strokeStyle = 'rgba(40,110,170,.7)'; ctx.lineWidth = 1.6 + s.size;
    this.rd.forEach(function (r) { ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 2, r.y - 12); ctx.stroke(); });
  }
};

</script>

<script>
/* labflow.js — the shared cycle every lab follows:
   short task → interaction → observation → inference question → adaptive feedback.
   The lab supplies what is concept-specific (its extra activity, scaffold, guided demo,
   challenge); LabFlow executes whatever the engine decides. */
window.WC = window.WC || {};

WC.LabFlow = function (o) {
  var UI = WC.UI, E = WC.Engine, N = WC.Nuqta, K = WC.CONTENT[o.concept];
  var L = o.app.learner, self = this;
  var held = false, solved = false, unlocked = false, q;

  var gate = UI.h('<p class="path-note" data-role="gate"><span class="ico" aria-hidden="true">🔒</span><span>' + (o.gateText || 'سيظهر سؤال الاستنتاج بعد أن تجرّب وتلاحظ.') + '</span></p>');
  var qBlock = UI.h('<div class="step-block" hidden></div>');
  var fb = UI.h('<div class="feedback" aria-live="polite"></div>');
  var after = UI.h('<div class="step-block"></div>');
  o.host.appendChild(gate); o.host.appendChild(qBlock); o.host.appendChild(after);

  q = new UI.Question(qBlock, { id: o.concept, prompt: K.prompt, options: K.options, onAnswer: onAnswer });
  qBlock.appendChild(fb);

  this.refresh = function () {
    if (!unlocked && o.isReady()) {
      unlocked = true; gate.hidden = true; qBlock.hidden = false;
      if (!o.quietUnlock) N.say({ kind: 'question', text: 'لاحظتَ ما يكفي. ' + K.prompt + ' اختر ما يصف ملاحظتك.', timeout: 9000 });
    }
  };
  /* called by the lab when its extra activity is complete */
  this.release = function () {
    if (!held) return;
    held = false; q.unlock();
    UI.feedback(fb, 'near', 'أكملتَ التجربة الإضافية', 'استخدم ما لاحظته الآن، وأجب من جديد.');
    N.say({ kind: 'cheer', text: 'أحسنت! الآن صار لديك دليل أوضح. أجب من جديد.', timeout: 7000 });
    q.focusFirst();
  };
  this.isHeld = function () { return held; };

  function onAnswer(opt) {
    var d = E.answer(L, o.concept, opt);
    if (opt.correct) {
      solved = true; q.markRight(opt.id); N.hide();
      UI.feedback(fb, 'good', 'استنتاج دقيق', opt.fb);
      after.appendChild(UI.discovery(o.concept));
      if (d.action === 'challenge' && (K.challenge || o.interactiveChallenge)) runChallenge();
      else showNext();
      o.onSolved && o.onSolved(d);
      return;
    }
    q.markTried(opt.id);
    var line = '<br><small class="muted">استجابتك تعطينا دليلًا على ما تحتاج إلى اكتشافه بعد ذلك.</small>';
    if (d.action === 'extra') {
      held = true; q.lock();
      UI.feedback(fb, 'near', o.nearTitle || 'اقتربت…', opt.fb + line);
      N.say({ kind: 'why', text: o.whyText });
      o.onExtra(self);
    } else if (d.action === 'scaffold') {
      q.reduceTo(d.keep, false);
      UI.feedback(fb, 'near', 'لنقترب أكثر', opt.fb + line);
      N.say({ kind: 'scaffold', text: o.scaffoldText });
      o.onScaffold && o.onScaffold();
    } else {
      q.reduceTo(d.keep, true); q.lock();
      UI.feedback(fb, 'near', 'لنشاهد معًا', 'ستعرض نُقطة التجربة خطوة بخطوة، ثم تختار من خيارين.');
      o.onGuided(function () { q.unlock(); q.focusFirst(); });
    }
  }

  function runChallenge() {
    var box = UI.h('<div class="step-block"><span class="tag challenge">⬆ رُفع مستوى التحدي لأنك أتقنت المفهوم من المحاولة الأولى</span></div>');
    after.appendChild(box);
    if (o.interactiveChallenge) {
      o.interactiveChallenge(box, function (passed) { E.challengeResult(L, o.concept, passed); showNext(); });
      return;
    }
    var first = true, cfb = UI.h('<div class="feedback"></div>');
    var cq = new UI.Question(box, { id: o.concept + '-ch', prompt: K.challenge.prompt, options: K.challenge.options,
      onAnswer: function (opt) {
        if (opt.correct) {
          cq.markRight(opt.id);
          E.challengeResult(L, o.concept, first);
          UI.feedback(cfb, 'good', first ? 'اجتزت التحدي!' : 'وصلت!', 'نقلتَ ما اكتشفته إلى موقف جديد من الحياة.');
          showNext();
        } else { first = false; cq.markTried(opt.id); UI.feedback(cfb, 'near', 'فكّر مرة أخرى', opt.fb); }
      } });
    box.appendChild(cfb);
  }

  function showNext() {
    if (after.querySelector('[data-next]')) return;
    var row = UI.h('<div class="row end"><button class="btn" data-next type="button">' + o.nextLabel + ' <span class="arrow" aria-hidden="true">➜</span></button></div>');
    row.querySelector('button').onclick = function () { o.app.go(o.next); };
    after.appendChild(row);
    setTimeout(function () { row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 200);
  }

  this.question = q;
};

/* helper for the guided demonstration: step a slider through values with narration */
WC.guidedDemo = function (steps, done) {
  var i = 0;
  (function next() {
    if (i >= steps.length) { WC.Nuqta.say({ kind: 'question', text: 'شاهدتَ التجربة كاملة. ما الذي يفسّر ما رأيت؟ اختر من الخيارين.' }); done(); return; }
    var s = steps[i++];
    s.apply();
    WC.Nuqta.say({ kind: 'scaffold', text: s.say });
    setTimeout(next, s.wait || 3600);
  })();
};

</script>

    var R = WC.RULES.explore.evaporation;
    var seenLow = false, seenHigh = false, compareNeeded = false, measured = { low: null, high: null }, busy = false;

    main.innerHTML =
      '<section class="lab screen">' +
      '<div class="panel">' +
      '<header><span class="eyebrow">المختبر الأول · الشمس والماء</span><h2>مختبر الشمس</h2>' +
      '<p class="task">حرّك <b>حرارة الشمس</b>، وراقب الماء وما يصعد منه.</p></header>' +
      '<div data-notes></div>' +

      '<ul class="checks" aria-label="خطوات الملاحظة"><li data-c="low">جرّب حرارة منخفضة</li><li data-c="high">جرّب حرارة مرتفعة</li></ul>' +
      '<div class="compare" data-compare hidden>' +
      '<b>🔬 تجربة مقارنة</b><span class="muted">قِس كمية البخار في ٤ ثوانٍ عند حرارتين مختلفتين.</span>' +

      '<figure class="card stage" style="margin:0"><canvas role="img" aria-label="محاكاة: شمس فوق بحيرة، جزيئات ماء تتحرك، وبخار يتصاعد"></canvas>' +
      '<figcaption class="caption"><span class="legend"><span>⚪ جزيئات الماء</span><span>◌ بخار الماء</span></span><span data-live aria-live="polite"></span></figcaption></figure>' +

      onInput: function (v) { sim.set(v); track(v); } });
